<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descensus ad Inferos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 工房画面 -->
  <div id="app">
    <header id="top">
      <h1>Descensus ad Inferos<small>── 賢者の石を求めて ──</small></h1>
      <div class="lv">
        <div class="lvbox m"><span>M.Lv <b id="mlv">1</b></span><div class="xp"><div id="mxp"></div></div><small id="mxpt"></small></div>
        <div class="lvbox a"><span>A.Lv <b id="alv">1</b></span><div class="xp"><div id="axp"></div></div><small id="axpt"></small></div>
        <div class="lvbox sp"><span>SP <b id="sp">0</b></span></div>
      </div>
    </header>
    <nav id="tabs"></nav>
    <div id="body">
      <main id="panel"></main>
      <aside id="side">
        <div class="card"><h3>いまの目標</h3><div id="objective"></div></div>
        <div class="card"><div id="summary"></div></div>
        <div class="card btns">
          <button class="btn sm" data-act="save">保存</button>
          <button class="btn sm ghost" data-act="reset">最初から</button>
          <p class="small muted">10秒ごとに自動保存されます。</p>
        </div>
      </aside>
    </div>
  </div>

  <!-- 探索画面 -->
  <div id="field" hidden><canvas id="cv"></canvas></div>

  <!-- 物語・書物のウィンドウ -->
  <div id="modal" hidden><div id="modal-body"></div></div>
  <div id="toasts"></div>

  <!-- 読み込み順が大切: 画像一覧 → 画像読込 → データ → ルール → 探索 → 画面 → 起動 -->
  <script src="assets/manifest.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/field.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
