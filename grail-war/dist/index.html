<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e19">
<title>深見市聖杯戦争</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* =============================================================
   見た目（CSS）
   レイアウト: 上=状況バー / 中=物語や各画面（スクロール） / 下=タブ
   夜の聖杯戦争をイメージした、暗い一色のテーマで統一しています。
   ============================================================= */
:root {
  --bg: #0c0e19;        /* 夜の藍 */
  --bg-2: #121628;      /* パネル */
  --bg-3: #1a1f36;      /* 浮いた面 */
  --line: #2b3253;      /* 罫線 */
  --fg: #ebe5d6;        /* 月明かりの紙色 */
  --muted: #9ba1ba;
  --seal: #d43c4c;      /* 令呪の紅 */
  --seal-soft: #d43c4c33;
  --gold: #d2ad5f;      /* 聖杯の金 */
  --gold-soft: #d2ad5f26;
  --ok: #67c294;
  --ng: #e2716f;
  --sky-day: #8fb3d9;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  --font-rank: "Cinzel", "Times New Roman", serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.75;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
b { color: var(--gold); font-weight: 700; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; z-index: 1; }

/* ---------- 上部：状況バー ---------- */
.topbar { flex: none; position: relative; padding-block: 10px 10px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  border-bottom: 1px solid var(--line); background: #0c0e19e6; }
.topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.when { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.when-phase { font-size: 11px; letter-spacing: .12em; color: var(--muted); white-space: nowrap; }
.when-day { font-family: var(--font-display); font-size: 19px; font-weight: 700; white-space: nowrap; }
.time-chip { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.time-chip.day { color: var(--sky-day); border-color: #8fb3d955; }
.time-chip.night { color: var(--gold); border-color: #d2ad5f55; }
.seals { display: flex; gap: 3px; align-items: center; }
.seal { width: 18px; height: 22px; }
.seal path { fill: var(--seal); }
.seal.used path { fill: none; stroke: #d43c4c55; stroke-width: 1.2; }
.mini { display: flex; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.mini span b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }

/* ---------- 中央 ---------- */
.main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-block: 18px 28px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }

.scene-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.4; margin: 0 0 4px;
  text-wrap: balance; }
.scene-sub { font-size: 12px; letter-spacing: .14em; color: var(--gold); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.scene-sub::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, #d2ad5f66, transparent); }
.scene-body p, .scene-body .para { margin: 0 0 12px; }
.scene-body .para p { margin: 8px 0 0; }
.scene-body .quote { font-family: var(--font-display); font-size: 16px; padding: 10px 14px; border-left: 2px solid var(--gold);
  background: var(--gold-soft); border-radius: 0 6px 6px 0; }
.scene-body .note { font-size: 13px; color: var(--muted); }
.scene-body .news { font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--bg-2); }

.chk { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: baseline; font-size: 12px; padding: 3px 10px;
  border-radius: 6px; font-variant-numeric: tabular-nums; }
.chk.ok { background: #67c2941f; color: var(--ok); border: 1px solid #67c29455; }
.chk.ng { background: #e2716f1f; color: var(--ng); border: 1px solid #e2716f55; }
.chk em { font-style: normal; color: var(--muted); }

.choices { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.choice { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left;
  padding: 13px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-3); cursor: pointer;
  min-height: 52px; transition: border-color .15s, background .15s, transform .08s; }
.choice:hover { border-color: #d2ad5f88; }
.choice:active { transform: scale(.985); }
.choice:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.choice .c-label { font-weight: 500; }
.choice .c-hint { font-size: 11px; color: var(--muted); text-align: right; flex: none; max-width: 45%; line-height: 1.4; }
.choice[disabled] { opacity: .4; cursor: not-allowed; }
.choice.primary { background: linear-gradient(180deg, #2a2440, #1d1a30); border-color: #d2ad5f77; }
.choice.danger { border-color: #d43c4c88; background: linear-gradient(180deg, #2c1820, #1d1420); }
.choice.danger .c-label { color: #f3b7bd; }

/* ---------- 下部タブ ---------- */
.tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: #0c0e19f2;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.tab { background: none; border: 0; padding: 9px 0 8px; font-size: 11px; color: var(--muted); cursor: pointer; display: flex;
  flex-direction: column; align-items: center; gap: 2px; letter-spacing: .06em; }
.tab svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.tab.on { color: var(--gold); }
.tab:focus-visible { outline: 2px solid var(--gold); outline-offset: -4px; }
.tab .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--seal); position: absolute; margin-left: 18px; }

/* ---------- パネル共通 ---------- */
.panel h2 { font-family: var(--font-display); font-size: 20px; margin: 0 0 2px; }
.panel h3 { font-size: 12px; letter-spacing: .14em; color: var(--gold); margin: 22px 0 8px; font-weight: 500; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 3.2em 1fr 2.6em; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: #ffffff12; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--fg); border-radius: 3px; }
.bar.hp i { background: var(--ok); }
.bar.mp i { background: #7aa2e8; }
.bar.bond i { background: linear-gradient(90deg, var(--seal), var(--gold)); }
.bar.enemy i { background: var(--ng); }
.tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin: 2px 4px 2px 0; }
.tag.gold { color: var(--gold); border-color: #d2ad5f66; }
.tag.red { color: #f3b7bd; border-color: #d43c4c77; }
.tag.green { color: var(--ok); border-color: #67c29466; }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }

/* ---------- Fate式パラメータ表 ---------- */
.params { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.param { background: var(--bg-2); padding: 8px 10px 9px; min-width: 0; }
.param .pl { font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.param .pr { font-family: var(--font-rank); font-size: 22px; font-weight: 600; line-height: 1.2; color: var(--fg); }
.param .pr small { font-family: var(--font-body); font-size: 10px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.param .pr.up { color: var(--ok); }
.param .pr.down { color: var(--ng); }
.param .bar { margin-top: 4px; height: 3px; }
.param .bar i { background: var(--gold); }

/* ---------- サーヴァントカード ---------- */
.svcard { border: 1px solid #d2ad5f55; border-radius: 14px; padding: 16px; background:
  linear-gradient(160deg, #221d36 0%, #141829 60%); position: relative; overflow: hidden; }
.svcard::before { content: ""; position: absolute; right: -60px; top: -60px; width: 180px; height: 180px; border-radius: 50%;
  border: 1px solid #d2ad5f33; box-shadow: 0 0 0 14px #d2ad5f0d, 0 0 0 30px #d2ad5f08; }
.svclass { font-family: var(--font-rank); font-size: 12px; letter-spacing: .3em; color: var(--gold); }
.svname { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.35; margin: 2px 0 4px; text-wrap: balance; }
.np { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.np .np-name { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.np .np-ruby { font-size: 11px; color: var(--gold); letter-spacing: .08em; }

/* ---------- 陣営一覧 ---------- */
.rivals { display: flex; flex-direction: column; gap: 10px; }
.rival { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--bg-2); }
.rival.out { opacity: .5; }
.rival-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rival-cls { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.rival p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.intel { display: flex; gap: 3px; }
.intel i { width: 14px; height: 4px; border-radius: 2px; background: #ffffff1a; }
.intel i.on { background: var(--gold); }

/* ---------- 戦闘 ---------- */
.battle-field { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
.fighter { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg-2); }
.fighter.enemy { border-color: #d43c4c55; }
.fighter-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.fighter-name { font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.fighter .bar { margin-top: 6px; height: 8px; }
.vs { text-align: center; font-family: var(--font-rank); color: var(--seal); letter-spacing: .4em; font-size: 12px; }
.tell { font-size: 13px; padding: 8px 12px; border-radius: 8px; background: #d43c4c14; border: 1px solid #d43c4c44; color: #f3c9cd; }
.blog { font-size: 13px; color: var(--muted); border-left: 1px solid var(--line); padding-left: 10px; margin-top: 10px; }
.blog p { margin: 0 0 6px; }

/* ---------- タイトル・召喚 ---------- */
.title-wrap { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding-block: 12px; }
.circle { width: min(78vw, 300px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; display: block; }
.circle .ring { fill: none; stroke: var(--gold); stroke-width: .6; opacity: .75; }
.circle .ring.red { stroke: var(--seal); opacity: .9; }
.circle .spin { transform-origin: 50% 50%; animation: spin 60s linear infinite; }
.circle .spin.rev { animation-duration: 90s; animation-direction: reverse; }
.circle text { font-family: var(--font-rank); font-size: 4.2px; fill: var(--gold); letter-spacing: 1.2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.game-title { font-family: var(--font-display); font-size: 34px; font-weight: 800; text-align: center; letter-spacing: .08em; margin: 0; line-height: 1.3; }
.game-title small { display: block; font-size: 12px; letter-spacing: .5em; color: var(--gold); font-weight: 500; margin-bottom: 6px; }
.lead { color: var(--muted); font-size: 13px; text-align: center; margin: 0 auto; max-width: 30em; }
.summon-glow { animation: glow 1.6s ease-out both; }
@keyframes glow { 0% { filter: drop-shadow(0 0 0 #d2ad5f00); opacity: .3; transform: scale(.85); }
  60% { filter: drop-shadow(0 0 22px #d2ad5fcc); opacity: 1; } 100% { filter: drop-shadow(0 0 8px #d2ad5f66); transform: scale(1); } }
.reveal { animation: reveal .8s ease-out both; animation-delay: .6s; }
@keyframes reveal { from { opacity: .0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.field { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; }
.field label { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.field input { font: inherit; background: var(--bg-3); border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 10px 12px; width: 100%; }
.field input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
.birth-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--bg-2); }
.birth-name { font-family: var(--font-display); font-size: 19px; font-weight: 700; }

.log-list { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.log-list div { display: grid; grid-template-columns: 4.5em 1fr; gap: 10px; }
.log-list span { color: var(--muted); font-variant-numeric: tabular-nums; }

.ending-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.ending-stats div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg-2); font-size: 12px; color: var(--muted); }
.ending-stats b { display: block; font-size: 16px; color: var(--fg); font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  .circle .spin, .summon-glow, .reveal { animation: none; }
  .choice { transition: none; }
}

/* ---------- 行動選択の状況パネル ---------- */
.status-box { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 4px 0 6px; }
.status-box > div { background: var(--bg-2); padding: 6px 8px; font-size: 11px; color: var(--muted); min-width: 0; }
.status-box > div span { display: block; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-box b { font-size: 17px; color: var(--fg); font-weight: 700; font-variant-numeric: tabular-nums; }
.status-box em { font-style: normal; margin-left: 2px; }
.status-box .wide { grid-column: 1 / -1; font-size: 12px; line-height: 1.6; }
.status-box .wide span { display: inline; margin-right: 4px; color: var(--gold); }

/* ---------- 道具一覧 ---------- */
.item-list { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.item-list div { display: flex; flex-direction: column; border-left: 2px solid #d2ad5f66; padding-left: 10px; }
.item-list b { font-weight: 500; color: var(--fg); }
.item-list span { font-size: 12px; color: var(--muted); }

/* ---------- 戦闘：マスターの行動 ---------- */
.mact { margin: 12px 0 4px; }
.mact-head { font-size: 12px; letter-spacing: .12em; color: var(--gold); display: flex; justify-content: space-between; margin-bottom: 6px; }
.mact-head span { color: var(--muted); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.mact-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: flex; flex-direction: column; align-items: flex-start; gap: 0; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg-2); font-size: 13px; cursor: pointer; line-height: 1.35; min-height: 44px; justify-content: center; }
.chip small { font-size: 10px; color: var(--muted); }
.chip.on { border-color: var(--gold); background: var(--gold-soft); color: var(--gold); }
.chip[disabled] { opacity: .35; cursor: not-allowed; }
.chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.enemy-params { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: 11px; color: var(--muted); }
.enemy-params b { font-family: var(--font-rank); color: var(--fg); margin-left: 3px; font-weight: 600; }
.note.rule { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

/* =============================================================
   演出
   ============================================================= */
/* ---------- 空（時間帯で変わる背景）と雪 ---------- */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(120% 60% at 50% -10%, #1d2546 0%, transparent 60%), var(--bg); }
body[data-sky="day"]::before { background: radial-gradient(130% 55% at 50% -12%, #3a4f7a 0%, #1c2440 45%, transparent 75%),
  linear-gradient(180deg, transparent 60%, #2a2233 100%), #11152a; }
body[data-sky="dawn"]::before { background: radial-gradient(120% 60% at 50% 110%, #8a5a3c 0%, #43304a 40%, transparent 75%),
  radial-gradient(100% 50% at 50% -10%, #2a3156 0%, transparent 60%), #141429; }
body[data-sky="blood"]::before { background: radial-gradient(120% 60% at 50% -10%, #4a1420 0%, transparent 60%), #0e0a12; }
#snow { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
body:not(.fx-on) #snow { display: none; }

/* ---------- 文章の段落表示 ---------- */
.fx-on .rv { animation: rvIn .5s ease-out both; animation-delay: var(--d, 0ms); }
.fx-on .scene.skip .rv, .fx-on .scene.skip .rv * { animation: none !important; opacity: 1 !important; transform: none !important; }
@keyframes rvIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.fx-on .chk { animation: chkPop .45s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: inherit; }
@keyframes chkPop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.chk::before { content: "⚀"; font-size: 13px; line-height: 1; }

/* 物語の場面：題字を少し格調高く */
.scene.story .scene-title { font-size: 25px; letter-spacing: .04em; padding-left: 12px; border-left: 3px solid var(--seal); }
.scene.story .scene-sub { color: #e8a0a8; }

/* ---------- オーバーレイ（場面転換・章・カットイン） ---------- */
#overlay { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; cursor: pointer;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#overlay.show { display: grid; animation: ovIn .35s ease-out both; }
@keyframes ovIn { from { opacity: 0; } to { opacity: 1; } }
.ov-inner { text-align: center; max-width: 520px; animation: ovText .9s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes ovText { from { opacity: 0; transform: translateY(10px); letter-spacing: .5em; } to { opacity: 1; transform: none; } }
.ov-kicker { font-size: 12px; letter-spacing: .35em; color: var(--gold); margin-bottom: 8px; }
.ov-title { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1.25; text-wrap: balance; }
.ov-sub { font-family: var(--font-display); font-size: 18px; letter-spacing: .3em; color: var(--muted); margin-top: 6px; }
.ov-ruby { font-size: 13px; letter-spacing: .25em; color: var(--cc, var(--gold)); }
#overlay.day { background: radial-gradient(90% 50% at 50% 50%, #2c3a60f2, #0c0e19f5); }
#overlay.day .ov-sub { color: var(--sky-day); }
#overlay.night { background: radial-gradient(90% 50% at 50% 50%, #161a33f2, #06070ef8); }
#overlay.night .ov-sub { color: var(--gold); }
#overlay.chapter { background: #06070ef8; }
#overlay.chapter .ov-title { font-size: 52px; letter-spacing: .1em; }
#overlay.chapter .ov-title::after { content: ""; display: block; width: 60px; height: 2px; margin: 14px auto 0; background: var(--seal); }
#overlay.victory { background: radial-gradient(70% 40% at 50% 50%, #d2ad5f33, #0c0e19e0); }
#overlay.victory .ov-title { color: var(--gold); }
#overlay.dawn { background: radial-gradient(90% 60% at 50% 100%, #8a5a3ccc, #0c0e19f5); }
#overlay.blood { background: radial-gradient(90% 60% at 50% 50%, #4a1420ee, #050307fa); }
#overlay.blood .ov-title { color: #f3b7bd; }
/* 宝具カットイン：斜めの帯が走る */
#overlay.np { background: #04050af0; overflow: hidden; }
#overlay.np::before { content: ""; position: absolute; left: -20%; right: -20%; top: 50%; height: 150px; margin-top: -75px;
  background: linear-gradient(90deg, transparent, var(--cc), transparent); opacity: .3; transform: skewY(-8deg);
  animation: band 1.6s ease-out both; }
#overlay.np.enemy::before { background: linear-gradient(90deg, transparent, var(--seal), transparent); }
@keyframes band { from { transform: skewY(-8deg) translateX(-60%); } to { transform: skewY(-8deg) translateX(10%); } }
#overlay.np .ov-inner { position: relative; }
#overlay.np .ov-title { font-size: 34px; text-shadow: 0 0 24px var(--cc); }
#overlay.np.enemy .ov-title { text-shadow: 0 0 24px var(--seal); }

#overlay.seal { background: radial-gradient(60% 40% at 50% 50%, #d43c4c55, #050307f2); }
#overlay.seal .ov-title { color: #ffd9dc; font-size: 30px; text-shadow: 0 0 18px var(--seal); }
#overlay.seal .ov-kicker { color: #f3b7bd; }

/* ---------- 選択肢のアイコン・グリッド ---------- */
.aicon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; color: var(--gold); opacity: .9; }
.choice.danger .aicon { color: #f3a0a8; }
.choice .c-label { flex: 1; min-width: 0; }
.choice { justify-content: flex-start; }
.choices.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choices.grid .choice { flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; min-height: 66px; }
.choices.grid .choice .c-hint { text-align: left; max-width: none; }
.choices.grid .choice .aicon { width: 18px; height: 18px; }
.choices.grid .choice.wide { grid-column: 1 / -1; }
.choice.warn { border-color: #d43c4c66; }
.choice.warn .c-hint::after { content: "　⚠ 構えに不利"; color: #f3a0a8; }
.emblem { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; margin-right: 4px; }

/* ---------- ヘッダーの進行バー ---------- */
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: #ffffff0d; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--seal), var(--gold)); transition: width .6s; }
.progress b { position: absolute; top: -3px; width: 2px; height: 8px; background: var(--seal); }

/* ---------- 戦闘 ---------- */
.fighter { position: relative; border-left: 3px solid var(--cc, var(--line)); }
.fighter-name { display: flex; align-items: center; }
.bar { position: relative; }
.bar i { position: relative; transition: width .55s cubic-bezier(.3, .7, .3, 1); }
.bar i.lag { position: absolute; left: 0; top: 0; height: 100%; background: #ffffff55 !important; transition: width .8s ease-in; }
.bar.thin { height: 3px; margin-top: 4px; }
.dmg { position: absolute; right: 16px; top: 4px; font-family: var(--font-rank); font-weight: 600; font-size: 26px; color: #fff;
  text-shadow: 0 0 8px var(--seal), 0 2px 0 #000; pointer-events: none; animation: dmgUp 1.1s ease-out both; }
.dmg.crit { font-size: 34px; color: #ffd27a; }
#f-me .dmg { color: #ffc7cc; }
@keyframes dmgUp { 0% { opacity: 0; transform: translateY(8px) scale(.8); } 15% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-22px); } }
.fx-on .fighter.shake { animation: shake .4s; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }

.tri-node circle { fill: var(--bg-2); stroke: var(--line); stroke-width: 1.2; }
.tri-node text { fill: var(--fg); font-size: 9px; text-anchor: middle; font-family: var(--font-body); }
.tri-node.tell circle { fill: #d43c4c33; stroke: var(--seal); stroke-width: 1.8; }
.tri-arrow { stroke: var(--gold); stroke-width: 1.2; fill: none; opacity: .7; }
.tri-head { fill: var(--gold); }
.tri-text { font-size: 12px; color: var(--muted); line-height: 1.6; min-width: 0; }

/* ---------- 召喚の演出 ---------- */

.summon-name { font-family: var(--font-display); font-size: 28px; font-weight: 800; text-align: center; margin: 12px 0 0; text-wrap: balance; }

.fx-on .summon .circle .ring { stroke-dasharray: 320; animation: draw 1.4s ease-out both; }

.fx-on .summon .summon-name { animation: rvIn .8s ease-out both; animation-delay: 2.3s; }
.fx-on .summon .summon-line { animation: rvIn .8s ease-out both; animation-delay: 2.8s; }
.fx-on .summon .summon-card { animation: rvIn .8s ease-out both; animation-delay: 3.2s; }
.fx-on .scene.summon.skip *, .fx-on .scene.summon.skip { animation: none !important; }
.fx-on .scene.summon.skip .summon-flash { opacity: 0; }

/* ---------- タイトル・設定・ギャラリー ---------- */
.title-sub { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.title-sub .choice { min-height: 48px; padding: 10px 14px; }
.title-circle { filter: drop-shadow(0 0 18px #d43c4c33); }
.setting { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting b { display: block; font-weight: 500; }
.setting span { font-size: 12px; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--bg-2); border: 0; padding: 9px 4px; font-size: 13px; cursor: pointer; color: var(--muted); min-height: 40px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--gold-soft); color: var(--gold); font-weight: 700; }
.seg button:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 14px 0 6px; }
.gallery div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg-2); min-width: 0; }

.dawn-circle .ring { stroke: #e8c58a; }

@media (prefers-reduced-motion: reduce) {

/* ---------- 成長期 ---------- */
.birth-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 6px 0; }

.grow-stats { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg-2); margin: 6px 0 4px; }

</style>

// ---- ランク → 数値 ----
// 判定では「数値 + サイコロ」で勝負します。
function rankValue(r) {
  if (!r) return 0;
  if (r === '？') return 40;      // 不明：Bランク相当として扱う
  if (r === '－' || r === 'なし') return 30;
  const base = { E: 10, D: 20, C: 30, B: 40, A: 50, EX: 65 };
  const m = r.match(/^(EX|[A-E])(\+*)(-*)$/);
  if (!m) return 30;
  return base[m[1]] + m[2].length * 5 - m[3].length * 3;
}
// 数値 → 表示用ランク（マスター補正後の表示に使う）
function valueRank(v) {
  if (v >= 65) return 'EX';
  const table = [[60, 'A++'], [55, 'A+'], [50, 'A'], [45, 'B+'], [40, 'B'], [35, 'C+'], [30, 'C'], [25, 'D+'], [20, 'D'], [15, 'E+'], [0, 'E']];
  for (const [t, r] of table) if (v >= t) return r;
  return 'E';
}

// ---- クラス相性（FGOの三すくみをベースに簡略化） ----
// 戻り値: 攻撃側から見た補正値
function classAffinity(atk, def) {
  const adv = {
    'セイバー': ['ランサー'], 'ランサー': ['アーチャー'], 'アーチャー': ['セイバー'],
    'ライダー': ['キャスター'], 'キャスター': ['アサシン'], 'アサシン': ['ライダー'],
    'アヴェンジャー': ['ルーラー'], 'ルーラー': [],
  };
  if (atk === 'バーサーカー' || def === 'バーサーカー') return 6;   // 狂戦士は与える・受ける両方が大きい
  if ((adv[atk] || []).includes(def)) return 8;
  if ((adv[def] || []).includes(atk)) return -8;
  return 0;
}

// ---------------- 設定（ブラウザに保存） ----------------
const CFG_KEY = 'fukami-cfg';
const END_KEY = 'fukami-endings';
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let CFG = { speed: 1, fx: !REDUCED, sound: false };
try { Object.assign(CFG, JSON.parse(localStorage.getItem(CFG_KEY) || '{}')); } catch (e) { }
function saveCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch (e) { } applyCfg(); }
function applyCfg() { document.body.classList.toggle('fx-on', !!CFG.fx); }
const SPEED_STEP = [0, 230, 420];        // 文字送り：段落ごとの表示間隔（ミリ秒）
const SPEED_NAMES = ['瞬時', '普通', 'ゆっくり'];
let REVEAL_UNTIL = 0;                    // 文章の表示演出が終わる時刻

// ---------------- エンディングの記録 ----------------
const ENDING_LIST = [
  ['destroySpecial', '夜明けの約束'], ['destroy', '冬の終わり'], ['together', '共に生きる'], ['servantWish', '託された願い'],
  ['none', '願いなき勝者'], ['abstain', '日常への帰還'], ['wish', '歪んだ願い'], ['wishKnown', '承知の上の願い'], ['devoured', '黒い夜明け'],
  ['lost', '脱落'], ['dead', '血に染まる冬'],
];
function seenEndings() { try { return JSON.parse(localStorage.getItem(END_KEY) || '[]'); } catch (e) { return []; } }
function markEnding(k) {
  const s = seenEndings(); if (s.includes(k)) return;
  s.push(k); try { localStorage.setItem(END_KEY, JSON.stringify(s)); } catch (e) { }
}

// ---------------- 効果音（その場で合成。初期設定はOFF） ----------------
let AC = null;
function audio() {
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(ac, freq, t0, dur, type = 'sine', vol = 0.06, endFreq) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(ac, t0, dur, vol = 0.08, freq = 900) {
  const len = Math.floor(ac.sampleRate * dur); const buf = ac.createBuffer(1, len, ac.sampleRate); const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(ac.destination); s.start(t0);
}
function sfx(name) {
  if (!CFG.sound) return;
  try {
    const ac = audio(); if (!ac) return; const t = ac.currentTime;
    if (name === 'tick') beep(ac, 1200, t, 0.05, 'sine', 0.025);
    if (name === 'hit') { noise(ac, t, 0.18, 0.12, 700); beep(ac, 120, t, 0.18, 'triangle', 0.08, 60); }
    if (name === 'crit') { noise(ac, t, 0.3, 0.16, 1500); beep(ac, 220, t, 0.3, 'square', 0.04, 80); }
    if (name === 'np') { beep(ac, 180, t, 0.9, 'sawtooth', 0.035, 1400); noise(ac, t + 0.6, 0.6, 0.1, 2500); }
    if (name === 'seal') { beep(ac, 660, t, 1.2, 'sine', 0.05); beep(ac, 990, t + 0.05, 1.2, 'sine', 0.035); beep(ac, 1320, t + 0.1, 1.0, 'sine', 0.02); }
    if (name === 'summon') { [262, 330, 392, 523].forEach((f, i) => beep(ac, f, t + i * 0.18, 1.8, 'sine', 0.04)); noise(ac, t + 0.9, 0.8, 0.06, 3000); }
    if (name === 'win') [523, 659, 784, 1047].forEach((f, i) => beep(ac, f, t + i * 0.1, 0.5, 'triangle', 0.04));
    if (name === 'lose') [392, 330, 262, 196].forEach((f, i) => beep(ac, f, t + i * 0.18, 0.6, 'sine', 0.04));
    if (name === 'page') beep(ac, 520, t, 0.25, 'sine', 0.02, 780);
  } catch (e) { }
}

// ---------------- 空と雪 ----------------
let SKY = null;
function setSky(mode) { document.body.dataset.sky = mode; }
function startSnow() {
  const c = document.createElement('canvas'); c.id = 'snow'; c.setAttribute('aria-hidden', 'true'); document.body.prepend(c);
  const ctx = c.getContext('2d'); let w = 0, h = 0, dpr = 1;
  const flakes = [...Array(46)].map(() => ({ x: Math.random(), y: Math.random(), r: 0.6 + Math.random() * 1.8, s: 0.15 + Math.random() * 0.4, d: Math.random() * 6 }));
  const resize = () => { dpr = Math.min(2, window.devicePixelRatio || 1); w = c.clientWidth; h = c.clientHeight; c.width = w * dpr; c.height = h * dpr; };
  window.addEventListener('resize', resize); resize();
  const loop = t => {
    SKY = requestAnimationFrame(loop);
    if (!CFG.fx || document.hidden) { ctx.clearRect(0, 0, c.width, c.height); return; }
    const night = document.body.dataset.sky !== 'day';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = night ? 'rgba(235,229,214,0.55)' : 'rgba(255,255,255,0.7)';
    for (const f of flakes) {
      f.y += f.s / h * 2.2; f.x += Math.sin(t / 1800 + f.d) * 0.0004;
      if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); }
      ctx.beginPath(); ctx.arc(f.x * w, f.y * h, f.r, 0, Math.PI * 2); ctx.fill();
    }
  };
  SKY = requestAnimationFrame(loop);
}

// =============================================================
//  core.js … ゲームの土台（状態・判定・時間の進行・イベント表示）
//  大まかな流れ：
//   タイトル → 産まれの決定 → 準備期間（5日） → 召喚の夜
//   → 聖杯戦争（最大14日） → 天降山の決戦 → 聖杯 → エンディング
//  1日は「昼」と「夜」の2コマ。コマごとに行動を1つ選びます。
//  1プレイの目安は30分前後です。
// =============================================================

const SAVE_KEY = 'fukami-grail-war-v3';

  crystal: { name: '魔力結晶', cost: 2, desc: 'サーヴァントの魔力を40回復（戦闘中も使える）' },

let G = null;          // ゲームの状態（セーブされる）

// ---------------- 小さな道具 ----------------
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function wpick(items, wf) {
  const ws = items.map(wf); const total = ws.reduce((s, w) => s + w, 0);
  let r = Math.random() * total;
  for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SV_BY_ID = Object.fromEntries(SERVANTS.concat([BOSS]).map(s => [s.id, s]));

// ---------------- 名前・参照 ----------------
function M() { return esc(G.master.name); }
function servantOf(o) { return SV_BY_ID[o.servantId || (o.servant && o.servant.id)]; }
function SV() { return G.servant ? servantOf(G).short : 'サーヴァント'; }
const SVname = SV;
function birthOf() { return BIRTHS.find(x => x.id === G.master.birth); }

function aliveRivals() { return (G.rivals || []).filter(r => r.alive); }
function hostileRivals() { return aliveRivals().filter(r => !r.ally); }
function randomAliveRival() { return pick(aliveRivals()); }
function randomHostile() { return pick(hostileRivals()); }
// 今戦える敵（天降山に籠城した最後の陣営は除く）
function engageable() { return hostileRivals().filter(r => !r.siege); }

// ---------------- 状態を変える関数（イベントからも使う） ----------------
function note(t) { NOTES.push(t); }
function gain(stat, n) { const st = G.master.stats; st[stat] = clamp(st[stat] + n, 1, 100); }
function money(n) { G.master.money = Math.max(0, G.master.money + n); }
function hp(n) { G.master.hp = clamp(G.master.hp + n, 0, G.master.hpMax); }
function od(n) { G.master.od = clamp(G.master.od + n, 0, odMax()); }
function odMax() { return 20 + Math.floor(G.master.stats.mag * 0.6); }
function shp(n) { if (G.servant) G.servant.hp = clamp(G.servant.hp + n, 0, servantHpMax()); }
function mp(n) { if (G.servant) G.servant.mp = clamp(G.servant.mp + n, 0, 100); }
function item(k, n) { G.items[k] = clamp((G.items[k] || 0) + n, 0, ITEM_MAX); }
function bond(n) {
  if (!G.servant || n === 0) return;
  if (n > 0 && G.master.birth === 'civilian') n = Math.round(n * 1.3);
  const before = Math.floor(G.servant.bond / 10);
  G.servant.bond = clamp(G.servant.bond + n, 0, 100);
  const after = Math.floor(G.servant.bond / 10);
  if (after > before) note(`<span class="tag gold">絆Lv ${after} に上昇</span>`);
}

// 選択肢の「傾向」：マスターの属性が動き、サーヴァントの好き嫌いで絆も変わる
function tone(t) {
  const a = G.master.align;
  if (t === 'good') a.good = clamp(a.good + 8, -100, 100);
  if (t === 'evil') a.good = clamp(a.good - 8, -100, 100);
  if (t === 'law') a.law = clamp(a.law + 8, -100, 100);
  if (t === 'chaos') a.law = clamp(a.law - 8, -100, 100);
  if (!G.servant) return;
  const sv = servantOf(G); const [order, moral] = sv.align.split('・');
  let d = 0;
  if (order === '秩序') d += t === 'law' ? 2 : t === 'chaos' ? -2 : 0;
  if (order === '混沌') d += t === 'chaos' ? 2 : t === 'law' ? -1 : 0;
  if (moral === '善') d += t === 'good' ? 2 : t === 'evil' ? -3 : 0;
  if (moral === '悪') d += t === 'evil' ? 2 : 0;
  const bold = ['warrior', 'king', 'free'].includes(sv.persona);
  const calm = ['cool', 'scholar'].includes(sv.persona);
  if (t === 'cautious') d += calm ? 1 : bold ? -1 : 0;
  if (t === 'bold') d += bold ? 1 : calm ? -1 : 0;
  if (d > 0) { bond(d); note(`<span class="note">${SV()}は好ましく思ったようだ。（絆+${d}）</span>`); }
  if (d < 0) { bond(d); note(`<span class="note">${SV()}は少し不満そうだ。（絆${d}）</span>`); }
}
function alignLabel(a = G.master.align) {
  const o = a.law > 25 ? '秩序' : a.law < -25 ? '混沌' : '中立';
  const m = a.good > 25 ? '善' : a.good < -25 ? '悪' : '中庸';
  return `${o}・${m}`;
}

// ---------------- 判定 ----------------
// マスター判定：能力値 + サイコロ(1〜45) が 目標値 以上なら成功
function chk(stat, diff) {
  let v = G.master.stats[stat];
  if (stat === 'spi' && G.master.birth === 'fallen') v += 5;
  const roll = rand(1, 45); const total = v + roll; const ok = total >= diff;
  return { ok, margin: total - diff, text: `<span class="chk ${ok ? 'ok' : 'ng'}">【${STAT_LABEL[stat]}判定】${ok ? '成功' : '失敗'} <em>${v}+${roll}=${total} / 目標${diff}</em></span>` };
}
// サーヴァント判定：パラメータ（ランクを数値化）+ サイコロ
function schk(i, diff) {
  const v = servantParam(i); const roll = rand(1, 45); const total = v + roll; const ok = total >= diff;
  return { ok, margin: total - diff, text: `<span class="chk ${ok ? 'ok' : 'ng'}">【${SV()}・${PARAM_NAMES[i]}判定】${ok ? '成功' : '失敗'} <em>${v}+${roll}=${total} / 目標${diff}</em></span>` };
}

// マスターの魔力がサーヴァントの性能に影響する（Fateの設定に準拠）
function masterCorrection() {
  const m = G.master.stats.mag;
  if (m < 25) return -8; if (m < 40) return -4; if (m < 70) return 0; if (m < 85) return 3; return 5;
}
function servantParam(i) {
  const base = rankValue(servantOf(G).p[i]);
  return i === 4 ? base : Math.max(5, base + masterCorrection());
}
function servantHpMax() { return 70 + rankValue(servantOf(G).p[1]); }
function rivalParam(r, i) { const base = rankValue(servantOf(r).p[i]); return i === 4 ? base : base + (r.power - 6); }

// 触媒：まだ持っていない英霊の触媒からランダムに1つ

  try { localStorage.setItem(SAVE_KEY, LAST_HUB); } catch (e) { /* 保存できない環境でも遊べるように無視 */ }
}
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } LAST_HUB = null; }

// =============================================================
//  場面（シーン）の表示
// =============================================================
// scene({ title, sub, body:[段落...], choices:[{label, hint, fn, cls, disabled}] })
function scene(s) { SCENE = s; TAB = 'story'; render(); const m = document.querySelector('.main'); if (m) m.scrollTop = 0; }
function next(title, body, fn, label = '次へ', sub) {
  scene({ title, sub, body, reveal: true, choices: [{ label, fn, cls: 'primary', icon: 'next' }] });
}
function takeNotes() { const n = NOTES; NOTES = []; return n; }
function paras(list) { return list.filter(Boolean).map(p => p.startsWith('<p') || p.startsWith('<div') ? p : `<div class="para">${p}</div>`); }

// =============================================================
//  時間の進行
// =============================================================
function phaseLabel() {
  if (!G) return '';
  if (G.phase === 'growth') return '成長期';
  if (G.phase === 'prep') return '令呪の冬';
  if (G.phase === 'summon') return '召喚の夜';
  if (G.phase === 'war') return '聖杯戦争';
  return '終幕';
}
function isNight() { return G.slot === 1; }

// コマの始まり：ニュース → 物語 → 決戦判定 → ランダムイベント → 行動選択
function startSlot() {
  if (checkGameOver()) return;
  if (G.phase === 'prep' && G.day > PREP_DAYS) { G.phase = 'summon'; return summonScene(); }
  if (G.phase === 'war') {
    if (aliveRivals().length === 0) return victoryScene();
    if (hostileRivals().length === 0) return breakAlliance();
  }
  if (!SLOT.news && G.news.length && G.slot === 0) {
    SLOT.news = true;
    const n = G.news.splice(0);
    return next('昨夜の出来事', n.map(t => `<p class="news">${t}</p>`), startSlot, '次へ', 'NEWS');
  }
  if (!SLOT.story) {
    SLOT.story = true;
    const beat = STORY.find(s => s.phase === G.phase && s.day === G.day && s.slot === G.slot && !G.used[s.id] && (!s.cond || s.cond()));
    if (beat) {
      const go = () => showEvent(beat, beat.after === 'advance' ? advance : startSlot);
      if (beat.chapter && beat.chapter !== G.lastChapter) { G.lastChapter = beat.chapter; return chapterCard(beat.chapter, go); }
      return go();
    }
  }
  if (G.phase === 'war' && aliveRivals().length === 1) {
    const last = aliveRivals()[0];
    if (isNight() && G.day >= FINAL_DAY) return finalBattleIntro();
    if (!last.siege) return siegeScene(last);
  }
  if (!SLOT.event) {
    SLOT.event = true;
    if (Math.random() < EVENT_CHANCE[G.phase]) { const ev = drawEvent(); if (ev) return showEvent(ev, startSlot); }
  }
  hub();
}
function advance() {
  if (checkGameOver()) return;
  SLOT = {};
  G.slot++;
  if (G.slot > 1) { G.slot = 0; G.day++; dailyUpdate(); }
  if (G.phase === 'war' && G.day > WAR_DAYS) return deadlineScene();
  slotCard(startSlot);
}
function dailyUpdate() {
  hp(10); od(Math.ceil(odMax() * 0.6));
  if (G.phase === 'war' && G.servant) {
    mp(15 + Math.floor(G.master.stats.mag * 0.3) + G.workshop * 5);
    shp(10 + G.workshop * 3);
    for (const r of aliveRivals()) { r.hp = Math.min(r.hpMax, r.hp + 18); r.mp = Math.min(100, r.mp + 30); }
    simulateRivals();
  }
}

// ライバル同士の戦い（画面外で進む）
function simulateRivals() {
  const alive = aliveRivals();
  if (alive.length < 3 || G.day < 3) return;   // 最後の2陣営はプレイヤーと決着をつける
  const p = 0.1 + G.day * 0.015;
  if (Math.random() > p) return;
  const [a, b] = shuffle(alive).slice(0, 2);
  const power = r => [0, 1, 2, 3, 5].reduce((s, i) => s + rivalParam(r, i), 0) / 5 + r.power + r.hp / 8 + rand(0, 30);
  const [win, lose] = power(a) >= power(b) ? [a, b] : [b, a];
  lose.alive = false; lose.hp = 0;
  win.hp = Math.max(20, win.hp - rand(20, 50)); win.clues = (win.clues || 0) + (Math.random() < 0.5 ? 1 : 0);
  const place = pick(['港の倉庫街', '城跡公園', '御影川の河川敷', '天降山の山道', '駅前の再開発地区']);
  G.news.push(`昨夜、${place}で激しい戦闘があった。<b>${rivalLabel(lose)}陣営</b>が脱落したようだ。` +
    (win.intel >= 1 ? `勝ったのは${rivalLabel(win)}陣営らしい。手負いのはずだ。` : ''));
  addLog(`${rivalLabel(lose)}陣営が${rivalLabel(win)}陣営に敗れ脱落。`);
}

function checkGameOver() {
  if (!G || G.phase === 'end') return true;
  if (G.master.hp <= 0) { ending('dead'); return true; }
  return false;
}

// =============================================================
//  イベント（ランダム・物語共通）
// =============================================================
function drawEvent(forceTime) {
  const t = forceTime || (isNight() ? 'night' : 'day');
  const ph = G.phase;
  const list = EVENTS.filter(e =>
    (e.phase === 'any' || e.phase === ph) &&
    (e.time === 'any' || e.time === t) &&
    !(e.once && G.used[e.id]) &&
    (!e.cond || e.cond()));
  if (!list.length) return null;
  return wpick(list, e => e.weight || 1);
}
// after：結果を読んだ後に進む先（advance＝コマを使い切る / startSlot＝行動選択へ）
function showEvent(ev, after = advance) {
  G.used[ev.id] = true;
  const text = typeof ev.text === 'function' ? ev.text() : ev.text;
  const choices = ev.choices
    .filter(c => !c.cond || c.cond())
    .map(c => ({
      label: typeof c.label === 'function' ? c.label() : c.label, hint: c.hint, cls: c.cls,
      fn: () => {
        NOTES = [];
        const res = c.run();
        let body = [], then = null;
        if (res && res.text !== undefined) { body = [].concat(res.text); then = res.then; } else body = [].concat(res);
        body = paras(body.concat(takeNotes()));
        next(ev.title, body, then || after, then ? '次へ' : '次へ', ev.chapter ? 'STORY' : 'EVENT');
      },
    }));
  if (!choices.length) choices.push({ label: '次へ', fn: after });
  scene({ title: ev.title, sub: ev.chapter || 'EVENT', body: paras([text]), choices, reveal: true });
}

// =============================================================
//  actions.js … 行動選択（ハブ）と、各行動の中身
//  聖杯戦争中は「何を優先するか」が戦略になります。
//   情報（真名を暴く） / 陣地（守りを固める） / 道具（戦闘の切り札）
//   絆（サーヴァントの力を引き出す） / 攻勢（敵を減らす）

function hub() {
  G.tmpRival = null;
  saveGame();
  const flavor = pick(FLAVOR[isNight() ? 'night' : 'day']);
  const body = [`<p>${flavor}</p>`];
  let acts;
  if (G.phase === 'prep') {
    body.push(`<p class="note">召喚の夜まで、あと${PREP_DAYS - G.day + 1}日。能力を鍛え、触媒を探し、召喚陣を整えよう。</p>`);
    acts = isNight() ? prepNightActions() : prepDayActions();
  } else {
    body.push(statusLine());
    const last = aliveRivals().find(r => r.siege);
    if (last) body.push(`<p class="note">最後の敵・${rivalLabel(last)}陣営は天降山に籠城している。決戦は<b>${FINAL_DAY}日目の夜</b>。それまでに力を蓄えよう。</p>`);
    else if (G.day >= FINAL_DAY - 2) body.push(`<p class="note">聖杯の降臨が近い。残り一陣営になれば、${FINAL_DAY}日目以降の夜に天降山で決戦となる。</p>`);
    acts = isNight() ? warNightActions() : warDayActions();
  }
  scene({ title: isNight() ? '夜の行動' : '昼の行動', sub: `${phaseLabel()}・${G.day}日目`, body, choices: acts });
}
function statusLine() {
  const sv = G.servant; const allies = aliveRivals().length - hostileRivals().length;
  const items = Object.keys(ITEMS).filter(k => G.items[k]).map(k => `${ITEMS[k].name}×${G.items[k]}`).join('　') || 'なし';
  return `<div class="status-box">
    <div><span>敵陣営</span><b>${hostileRivals().length}</b>${allies ? `<em>同盟${allies}</em>` : ''}</div>
    <div><span>${SV()}</span><b>${sv.hp}</b><em>/${servantHpMax()}</em></div>
    <div><span>英霊の魔力</span><b>${sv.mp}</b></div>
    <div><span>オド</span><b>${G.master.od}</b><em>/${odMax()}</em></div>
    <div class="wide"><span>陣地</span>Lv${G.workshop}・罠${G.traps}　<span>道具</span>${items}</div>
  </div>`;
}
// 行動の結果を表示して、コマを進める
function actResult(title, fn) {
  NOTES = [];
  const res = [].concat(fn()).filter(Boolean).concat(takeNotes());
  next(title, paras(res), advance);
}
// サブメニュー（「やめる」で行動選択に戻る）
function submenu(title, sub, text, choices) {
  choices.push({ label: 'やめる', fn: hub });
  scene({ title, sub, body: paras([].concat(text)), choices });
}

      }) };

}
function researchDiff(r) { return Math.max(40, 78 - (r.clues || 0) * 8 - (r.intel >= 2 ? 5 : 0)); }

// 情報を1段階進める：1=マスター判明 2=拠点判明 3=真名判明

  return intelText(r);
}
function intelText(r) {

}

function warNightActions() {
  const targets = engageable().filter(r => r.intel >= 2);
  const none = !engageable().length;
  const acts = [
    { label: '夜の巡回', hint: none ? '敵は天降山に籠城中' : '慎重 or 挑発。敵を探す', disabled: none, fn: patrolMenu, cls: 'danger' },
    { label: `${SV()}に偵察させる`, hint: none ? '敵は天降山に籠城中' : '敏捷判定で情報↑・失敗すると戦闘', disabled: none, fn: scoutMenu },
  ];
  if (targets.length) acts.push({ label: '敵の拠点を襲撃する', hint: '作戦を選んで仕掛ける', fn: assaultMenu, cls: 'danger' });
  acts.push(
    { label: '拠点で迎え撃つ', hint: `陣地Lv${G.workshop}・罠${G.traps}で待ち構える`, fn: defendBase },
    { label: `${SV()}と語らう`, hint: G.servant.bond >= 70 && !G.servant.special ? '何かが起きそうだ' : '絆↑', fn: nightTalk },
    { label: '魔力を回復して休む', hint: '魔力・HP回復（夜襲の危険）', fn: nightRest },
  );
  return acts;
}
// 夜に拠点にいると襲われることがある
function baseAttackChance() { return 0.08 + G.day * 0.01 + (G.servant.exposed ? 0.1 : 0); }
function maybeRaided(after) {
  if (engageable().length && Math.random() < baseAttackChance()) {
    const r = wpick(engageable(), x => x.aggr);
    return next('夜襲', [`<p>結界が軋む音がした。――<b>${rivalLabel(r)}陣営</b>の襲撃だ！ 陣地の力で迎え撃つ。</p>`],
      () => startBattle(r, { defend: true }), '迎え撃つ');
  }
  after();
}

function patrolMenu() {
  submenu('夜の巡回', 'PATROL', '<p>どう動く？</p>', [
    { label: '慎重に探る', hint: '遭遇しにくいが、先に敵を見つけられる', fn: () => patrol('careful') },
    { label: '魔力を隠さず挑発する', hint: '高確率で戦闘・大胆', cls: 'danger', fn: () => patrol('bold') },
  ]);
}
function patrol(mode) {
  const foes = engageable();
  const p = mode === 'bold' ? 0.75 : 0.4;
  if (Math.random() < p && foes.length) {
    const r = wpick(foes, x => 0.5 + x.aggr);
    r.intel = Math.max(r.intel, 1);
    if (mode === 'bold') {
      NOTES = []; tone('bold');
      return next('遭遇', paras([`${pick(CITY.places)}で魔力を解き放つと、すぐに応える気配があった。`,
        `――<b>${rivalLabel(r)}</b>のサーヴァントだ。マスターの${esc(r.master)}の姿もある。`, `<p class="quote">「${r.quote}」</p>`, ...takeNotes()]),
        () => startBattle(r, {}), '戦う');
    }
    return scene({ title: '発見', sub: 'PATROL', body: paras([`${pick(CITY.places)}の暗がりで、先に敵の姿を捉えた。<b>${rivalLabel(r)}</b>陣営だ。まだこちらには気付いていない。`]),
      choices: [
        { label: '奇襲を仕掛ける', hint: '最初の手番に大きな補正', cls: 'danger', fn: () => startBattle(r, { ambush: true }) },
        { label: '尾行して情報を得る', hint: '情報+1', fn: () => actResult('尾行', () => { r.intel = Math.min(3, r.intel + 1); r.clues = (r.clues || 0) + 1;
          return ['気付かれないよう後をつけた。', intelText(r)]; }) },
        { label: 'やり過ごす', fn: () => actResult('巡回', () => { tone('cautious'); return '息を殺して、敵が通り過ぎるのを待った。'; }) },
      ] });
  }
  if (Math.random() < 0.35) { const ev = drawEvent('night'); if (ev) return showEvent(ev, advance); }
  actResult('夜の巡回', () => {
    const t = Math.random() < (G.flags.investigate ? 0.6 : 0.35) ? intelRandom(1) : '';
    return ['静かな夜だった。敵の姿は見当たらない。', t ? '戦いの痕跡を見つけた。' + t : ''];
  });
}

function scoutMenu() {
  const bonus = isAssassin() ? 15 : 0;
  submenu('偵察', 'SCOUT', `<p>${SV()}を単独で偵察に出す。${isAssassin() ? '気配遮断を持つアサシンは偵察が得意だ。' : ''}失敗すると敵に見つかり、不利な状態で戦闘になる。</p>`,
    engageable().map(r => ({
      label: `${rivalLabel(r)}陣営を探る`, hint: `敏捷判定 目標${60 - bonus}・情報${r.intel}/3`, disabled: r.intel >= 3,
      fn: () => {
        NOTES = []; const c = schk(2, 60 - bonus);
        if (c.ok) {
          r.intel = Math.min(3, r.intel + 1); r.clues = (r.clues || 0) + 1;
          const t = [intelText(r)];

        return next('偵察失敗', paras([c.text, `${SV()}の気配が敵に察知された！ ${rivalLabel(r)}陣営が迫ってくる。`]),

}

function bondTier() { const b = G.servant.bond; return b < 30 ? 'low' : b < 60 ? 'mid' : 'high'; }
function hangoutMenu() {
  const choices = Object.entries(ACTIVITIES).map(([k, a]) => ({
    label: a.name, hint: `${a.place}${a.cost ? `・資金-${a.cost}` : ''}`, disabled: G.master.money < a.cost,
    fn: () => hangout(k),
  }));
  submenu(`${SV()}と過ごす`, 'BOND', [`<p>今日はどう過ごそうか。${SV()}にも好みがあるようだ。</p>`,
    G.servant.bond >= 20 ? `<p class="note">${SV()}が好きそうなこと：${PERSONAS[servantOf(G).persona].likes.map(k => ACTIVITIES[k].name).join('、')}</p>` :
      '<p class="note">絆が深まれば、好みも分かってくるだろう。</p>'], choices);
}
function hangout(k) {
  NOTES = [];
  const a = ACTIVITIES[k]; const per = PERSONAS[servantOf(G).persona];
  money(-a.cost);
  let n = 4, react = '';
  if (per.likes.includes(k)) { n = 8; react = `${SV()}はとても楽しそうだ。`; }
  else if (per.dislikes.includes(k)) { n = 1; react = `${SV()}はあまり気乗りしない様子だった。`; }
  n += Math.floor(G.master.stats.cha / 30);
  const statGain = { eat: ['cha', 1], train: ['phy', 2], walk: ['luk', 1], talk: ['int', 1], shop: ['cha', 1], quiet: ['spi', 2] }[k];
  gain(statGain[0], statGain[1]);
  bond(n);
  const line = fmt(pick(per[bondTier()]));
  next(a.name, [`<p>${a.place}で${SV()}と過ごした。${react}</p>`, `<p class="quote">${line}</p>`,
    `<p class="note">絆+${n}　${STAT_LABEL[statGain[0]]}+${statGain[1]}</p>`, ...paras(takeNotes())], advance);
}
function nightTalk() {
  const sv = G.servant;
  if (sv.bond >= 70 && !sv.special && sv.bond >= (G.flags.specialNext || 0)) return specialEvent();
  maybeRaided(() => {
    NOTES = [];
    const n = rand(3, 5); bond(n); mp(5);
    const per = PERSONAS[servantOf(G).persona];
    next('夜の語らい', [`<p>静かな夜。拠点の縁側で、${SV()}と言葉を交わした。</p>`, `<p class="quote">${fmt(pick(per[bondTier()]))}</p>`,
      `<p class="note">絆+${n}</p>`, ...paras(takeNotes())], advance);
  });
}
function specialEvent() {
  const per = PERSONAS[servantOf(G).persona];
  const choices = Object.entries(RELATIONS).map(([k, r]) => ({
    label: r.verb, hint: `関係：${r.name}`, fn: () => {
      G.servant.special = k; NOTES = []; bond(10);
      addLog(`${servantOf(G).name}と「${r.name}」の関係になる。`);
      next('特別な関係', [`<p>${fmt(r.text)}</p>`, `<p class="note">${SV()}と<b>「${r.name}」</b>になった。戦闘で絆の力が働き、エンディングにも影響する。</p>`,
        ...paras(takeNotes())], advance);
    },
  }));
  choices.push({ label: '今は、この関係のままで', fn: () => {
    G.flags.specialNext = G.servant.bond + 10;
    next('夜の語らい', [`<p>あなたは微笑んで、首を横に振った。${SV()}は少しだけ目を伏せ、「……そうか」と呟いた。</p>`,

  scene({ title: '月下の告白', sub: 'SPECIAL', body: [`<p>月の綺麗な夜だった。${SV()}がふと、真剣な顔であなたを見つめた。</p>`,
    `<p class="quote">${fmt(per.special)}</p>`, '<p>あなたは――</p>'], choices });
}

function summonScene() {
  const choices = G.catalysts.map(id => ({ label: `「${SV_BY_ID[id].catalyst}」を使う`, hint: '縁ある英霊を喚ぶ', fn: () => doSummon(id) }));
  choices.push({ label: '触媒を使わない', hint: `${alignLabel()}の自分に似た英霊が応える`, fn: () => doSummon(null) });
  const place = { heir: '家の工房', mission: G.master.birth === 'mercenary' ? '借り受けた倉庫' : '教会の地下聖堂', seeker: '自室の床' }[G.route] || '工房';
  scene({ title: '召喚の夜', sub: 'SUMMONING', body: [
    `<p>${G.route === 'seeker' ? '独学と教えを頼りに、ここまで来た。' : '準備の日々は終わった。'}今宵、聖杯戦争が始まる。</p>`,
    `<p>${place}に描いた召喚陣の前に立つ。右手の令呪が、熱を帯びて脈打っている。${G.ritual >= 3 ? '陣は完璧に仕上がっている。' : G.ritual > 0 ? '陣の準備はまずまずだ。' : '急ごしらえの陣だが、やるしかない。'}</p>`,
    '<p class="quote">「――天に満ちる星よ、地に眠る霊脈よ。我が血と令呪を標とし、契約の門を開け。応えよ、英霊。この呼び声に、この願いに」</p>',
    G.catalysts.length ? '<p>手元には触媒がある。どれを使おうか。</p>' : '<p>触媒は手に入らなかった。縁に任せるしかない。</p>',
  ], choices });
}
function doSummon(catalystId, opt = {}) {
  let sv;
  if (catalystId) sv = SV_BY_ID[catalystId];
  else {
    const a = alignLabel().split('・');
    const taken = new Set(G.rivals.map(r => r.servantId));
    sv = wpick(SERVANTS.filter(s => !taken.has(s.id)), s => {
      const [o, m] = s.align.split('・');
      let w = 1;
      if (o === a[0]) w += 1.5;
      if (m === a[1]) w += 1.5;
      if (!BASE_CLASSES.includes(s.cls)) w *= 0.4;
      if (G.flags.vision === s.id) w *= G.flags.visionStrong ? 6 : 2.5;
      return w;
    });
  }
  G.servant = { id: sv.id, hp: 0, mp: 60 + G.ritual * 13, bond: (opt.emergency ? 15 : 5) + G.ritual * 4, special: null, exposed: false };
  G.servant.hp = servantHpMax();
  if (!G.rivals.length) setupRivals();
  else fitRivalsToServant(sv);
  G.phase = 'war'; SLOT = {};
  if (opt.emergency) { G.day = 0; G.slot = 1; } else { G.day = 1; G.slot = 0; }
  addLog(`${sv.cls}「${sv.name}」を召喚。`);
  if (G.flags.earlyIntel) intelRandom(1);
  SCENE = { kind: 'summon', sv, emergency: !!opt.emergency }; TAB = 'story'; render(); sfx('summon');
}
function setupRivals() {
  // 召喚前（巻き込まれルート）は7陣営すべてを用意し、召喚後に1つ減らす
  const mine = G.servant ? servantOf(G).cls : null;
  let classes = BASE_CLASSES.filter(c => c !== mine);
  if (mine && classes.length > 6) classes = shuffle(classes).slice(0, 6);
  const types = shuffle(RIVAL_TYPES);
  G.rivals = classes.map((cls, i) => {
    const pool = SERVANTS.filter(s => s.cls === cls && (!G.servant || s.id !== G.servant.id));
    const s = pick(pool); const t = types[i];
    const r = { id: 'r' + i, cls, servantId: s.id, master: randomName(t.foreign), type: t.type, power: t.power + rand(-1, 1),
      aggr: t.aggr, quote: t.quote, alive: true, hp: 0, hpMax: 0, mp: 100, intel: 0, clues: 0, seals: 2 + rand(0, 1),
      ally: false, bounty: false, masterDead: false };
    r.hpMax = r.hp = 70 + rankValue(s.p[1]);
    return r;
  });
  // 幼馴染もマスターに選ばれていた
  if (G.friend) {
    const r = pick(G.rivals);
    Object.assign(r, { friend: true, master: G.friend.name, type: '幼馴染', power: 6, aggr: 0.25,
      quote: G.flags.friendRival ? 'やっと決着をつけられるね。……手加減しないから！'
        : G.friend.bond >= 60 ? 'ごめん。でも、どうしても叶えたい願いがあるんだ。'
          : '……あなたとは、戦いたくなかったな。' });
  }
}
function afterSummon() {
  if (G.route === 'caught' && G.day === 0) return caughtFirstFight();
  next('聖杯戦争、開幕', [
    '<p>こうして、深見市における聖杯戦争が幕を開けた。七騎のサーヴァントと七人のマスター。生き残るのは、ただ一組。</p>',
    `<p class="note">昼は情報・陣地・道具・絆を整える時間。夜は戦いの時間。敵の真名を暴き、作戦を選んで仕掛け、最後の一組となれ。期限は${WAR_DAYS}日。</p>`,
  ], startSlot, '戦いへ', '第一幕　開幕');
}

// 巻き込まれた夜：召喚直後の最初の戦い
function caughtFirstFight() {
  const r = G.storyRival;
  scene({ title: '契約', sub: 'PROLOGUE', reveal: true, body: paras([
    `光が収まると、あなたの前に${SV()}が立っていた。振り下ろされた${r.cls}の刃を、片手で受け止めて。`,
    servantOf(G).persona === 'berserker' ? `（${SV()}は低く唸り、あなたを背に庇うように立ちはだかった）`
      : `<p class="quote">「状況は分からないが、一つだけ確かなことがある。――君が、マスターだ」</p>`,
    `${esc(r.master)}が舌打ちした。「最後の一騎が、こんな素人に喚ばれるとはな」`,
    '何が起きているのか、何一つ分からない。けれど、今は――',
  ]), choices: [

    } },
  ] });
}

// 先に用意した7陣営を、召喚された英霊に合わせて6陣営に整える（巻き込まれルート用）
function fitRivalsToServant(sv) {
  const dup = G.rivals.find(r => r.servantId === sv.id);
  if (dup) { const alt = SERVANTS.filter(s => s.cls === dup.cls && s.id !== sv.id && !G.rivals.some(r => r.servantId === s.id)); if (alt.length) dup.servantId = pick(alt).id; }
  if (G.rivals.length <= 6) return;
  const keep = r => r === G.storyRival || r.friend;
  const victim = G.rivals.find(r => r.cls === sv.cls && !keep(r)) || G.rivals.find(r => !keep(r));
  G.rivals.splice(G.rivals.indexOf(victim), 1);
}

// =============================================================
//  growth.js … 成長期（0歳〜17歳）の進行
//  誕生 → [過ごし方を選ぶ → 出来事] × 7回 → 18歳の冬（令呪の発現）
// =============================================================

// ---- 幼馴染 ----
function makeFriend() { if (!G.friend) G.friend = { name: pick(NAMES.friend), bond: 0 }; return G.friend.name; }
function friendName() { return G.friend ? esc(G.friend.name) : ''; }
function friend(n) { if (G.friend) G.friend.bond = clamp(G.friend.bond + n, 0, 100); }
function hasMagic() { return birthOf().magic || !!G.flags.awakened; }
function kanjiNum(n) {
  const d = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  if (n <= 10) return n === 10 ? '十' : d[n];
  if (n < 20) return '十' + d[n - 10];
  return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
}
function currentStage() { return STAGES[G.growth.stage]; }

// 伸びやすさ（産まれ × 生まれつきの得意 × ゆらぎ）を掛けて能力を伸ばす
function growthMul(stat) { return (birthOf().growth[stat] || 1) * (G.master.talent === stat ? 1.3 : 1); }
const GROW_RATE = 1.2;   // 成長全体の倍率（大きくすると18歳時点の能力が高くなる）
function grow(stat, base) { const n = Math.max(1, Math.round(base * GROW_RATE * growthMul(stat) * (0.85 + Math.random() * 0.3))); gain(stat, n); return n; }

// ---------------- 誕生（0歳） ----------------
function growthStart() {
  const b = birthOf(); const m = G.master;
  G.lastChapter = '誕生';
  chapterCard('第零幕　生い立ち', () => {
    scene({ title: '誕生', sub: '0歳', reveal: true, body: paras([
      b.origin,
      `<div class="birth-facts"><div><span>魔術属性</span><b>${m.element}</b></div><div><span>魔術回路</span><b>${m.circuits}本</b></div><div><span>生まれつきの得意</span><b>${TALENTS[m.talent]}</b></div></div>`,
      `<span class="note">これから18歳になるまでの日々が、あなたの能力を形作る。どう育つかは、あなた次第だ。</span>`,
    ]), choices: [{ label: '産声を上げる', cls: 'primary', icon: 'next', fn: () => nextStage() }] });
  });
}

// ---------------- 成長の節目 ----------------
function growthStage() {
  const st = currentStage();
  saveGame();
  const b = birthOf();
  const list = Object.entries(FOCUS).filter(([, f]) =>
    G.master.age >= f.ages[0] && G.master.age <= f.ages[1] &&
    (!f.magic || hasMagic()) && (!f.births || f.births.includes(b.id)));
  const choices = list.map(([k, f]) => ({
    label: f.name,
    hint: Object.entries(f.gains).map(([s, v]) => `${STAT_LABEL[s]}${growthMul(s) >= 1.2 ? '↑↑' : '↑'}`).join(' ') + (f.money ? ' 資金↑' : '') + (f.catalyst ? ' 触媒?' : '') + (f.friend && G.friend ? ' 友情↑' : ''),
    icon: guessIcon(f.name) || 'train',
    fn: () => applyFocus(k),
  }));
  scene({ title: `${G.master.age}歳`, sub: `${st.band}　${b.home}`, body: [
    `<p>${st.text}</p>`,
    `<div class="grow-stats">${statBars(G.master.stats)}</div>`,
    `<p class="note">この数年を、どう過ごす？　↑↑は伸びやすい能力。</p>`,
  ], choices });
}
function applyFocus(k) {
  const f = FOCUS[k]; NOTES = [];
  const res = [];
  const ups = Object.entries(f.gains).map(([s, v]) => `${STAT_LABEL[s]}+${grow(s, v)}`);
  if (f.money) money(f.money);
  if (f.friend) friend(f.friend);
  if (f.tone) tone(f.tone);
  money(Math.max(1, Math.round(birthOf().money / 7)));   // おこづかい・仕送り
  res.push(`${G.master.age}歳からの数年間は、「${f.name}」日々だった。`);
  res.push(`<span class="note">${ups.join('　')}${f.money ? `　資金+${f.money}` : ''}</span>`);
  if (f.catalyst && Math.random() < f.catalyst) { const c = giveCatalyst(); res.push(`調べものの途中で、古い品を手に入れた。<b>${c}</b>だ。`); }
  addLog(`${G.master.age}歳：${f.name}。`);
  next(`${G.master.age}歳`, paras(res.concat(takeNotes())), growthEvent, '次へ', currentStage().band);
}
function growthEvent() {
  const age = G.master.age; const b = birthOf().id;
  const ok = e => !G.used[e.id] && (!e.births || e.births.includes(b)) && (!e.magic || hasMagic()) && (!e.cond || e.cond());
  let ev = GROWTH_EVENTS.find(e => e.fixed && e.ages[0] === age && ok(e));
  if (!ev) {
    const pool = GROWTH_EVENTS.filter(e => !e.fixed && age >= e.ages[0] && age <= e.ages[1] && ok(e));
    if (pool.length) ev = pick(pool);
  }
  if (!ev) return nextStage();
  showEvent({ ...ev, chapter: `${currentStage().band}・${age}歳` }, nextStage);
}
function nextStage() {
  G.growth.stage++;
  if (G.growth.stage >= STAGES.length) return comingOfAge();
  const st = currentStage();
  G.master.age = st.age;
  const go = () => growthStage();
  if (!CFG.fx) return go();
  if (st.band !== G.lastChapter) { G.lastChapter = st.band; return showCard({ kicker: st.band, title: `${kanjiNum(st.age)}歳`, sub: st.text, cls: 'chapter', ms: 1800 }, go); }
  showCard({ kicker: st.band, title: `${kanjiNum(st.age)}歳`, cls: 'day', ms: 1100 }, go);
}

// 18歳の冬（令呪の発現）は routes.js の comingOfAge() へ

// =============================================================
//  routes.js … 聖杯戦争への「関わり方」（参戦ルート）
//  18歳になった時点で、産まれ・成長中の選択・知った秘密の量で決まる。
//
//   heir      継承者     魔術の家に生まれ、家の務めとして参戦する
//   mission   請負人     依頼（傭兵）や命令（代行者）として参戦する
//   seeker    探求者     一般の生まれだが、自ら街の秘密に辿り着き、参戦を選ぶ
//   caught    巻き込まれた者  何も知らないまま、ある夜突然巻き込まれる
//   reluctant 背を向けた者  魔術の道を捨てようとしたが、令呪に選ばれてしまう
// =============================================================

const ROUTES = {
  heir:      { name: '継承者', desc: '魔術の家の務めとして、聖杯戦争に臨む' },
  mission:   { name: '請負人', desc: '依頼や命令を受け、聖杯戦争に臨む' },
  seeker:    { name: '探求者', desc: '自ら街の秘密に辿り着き、参戦を選んだ' },
  caught:    { name: '巻き込まれた者', desc: '何も知らないまま、聖杯戦争に巻き込まれた' },
  reluctant: { name: '背を向けた者', desc: '魔術の道に背を向けながら、令呪に選ばれた' },
};
function lore(n) { G.lore = (G.lore || 0) + n; }
function routeName() {
  if (!G.route) return '';
  return ROUTES[G.route].name + (G.flags.refused ? '（拒んだ末に）' : G.flags.wasReluctant ? '（覚悟の末に）' : '');
}

function decideRoute() {
  const b = birthOf().id; const f = G.flags;
  if (f.rebel) return 'reluctant';
  if (b === 'mercenary') return 'mission';
  if (b === 'executor' && f.churchPath) return 'mission';
  if (birthOf().magic) return 'heir';
  if (f.pursue) return 'seeker';
  return 'caught';
}

// ---------------- 18歳の冬 ----------------
function comingOfAge() {
  const b = birthOf(); const m = G.master;
  m.age = ADULT_AGE; m.hp = m.hpMax; m.od = odMax();
  G.route = decideRoute();
  G.phase = 'prep'; G.day = 1; G.slot = 0;   // ヘッダー表示用（行動選択は beginPrep から）
  const top = Object.entries(m.stats).sort((a, c) => c[1] - a[1]).slice(0, 2).map(([k]) => STAT_LABEL[k]);
  G.summary = `<span class="note">得意なこと：${top.join('・')}　／　在り方：${alignLabel()}</span>`;
  chapterCard('序章　令呪の冬', () => {
    G.lastChapter = '序章　令呪の冬';
    ({ heir: heirPrologue, mission: missionPrologue, seeker: seekerPrologue, caught: () => caughtPrologue(false), reluctant: reluctantPrologue })[G.route]();
  });
}
function beginPrep() {
  G.phase = 'prep'; G.day = 1; G.slot = 0; SLOT = {};
  addLog(`${ADULT_AGE}歳の冬、右手に令呪が現れる。（${routeName()}）`);

}

  return G.catalysts.length ? `手元には、これまでの人生で手にした触媒がある。<b>${G.catalysts.map(id => SV_BY_ID[id].catalyst).join('、')}</b>。` : '';
