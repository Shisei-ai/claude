<title>深見市聖杯戦争</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* =============================================================
   見た目（CSS）
   レイアウト: 上=状況バー / 中=物語や各画面（スクロール） / 下=タブ
   夜の聖杯戦争をイメージした、暗い一色のテーマで統一しています。
   ============================================================= */
:root {
  --bg: #0c0e19;        /* 夜の藍 */
  --bg-2: #121628;      /* パネル */
  --bg-3: #1a1f36;      /* 浮いた面 */
  --line: #2b3253;      /* 罫線 */
  --fg: #ebe5d6;        /* 月明かりの紙色 */
  --muted: #9ba1ba;
  --seal: #d43c4c;      /* 令呪の紅 */
  --seal-soft: #d43c4c33;
  --gold: #d2ad5f;      /* 聖杯の金 */
  --gold-soft: #d2ad5f26;
  --ok: #67c294;
  --ng: #e2716f;
  --sky-day: #8fb3d9;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  --font-rank: "Cinzel", "Times New Roman", serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.75;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
b { color: var(--gold); font-weight: 700; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative;
  background:
    radial-gradient(120% 60% at 50% -10%, #1d2546 0%, transparent 60%),
    var(--bg); }

/* ---------- 上部：状況バー ---------- */
.topbar { flex: none; padding-block: 10px 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  border-bottom: 1px solid var(--line); background: #0c0e19e6; }
.topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.when { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.when-phase { font-size: 11px; letter-spacing: .12em; color: var(--muted); white-space: nowrap; }
.when-day { font-family: var(--font-display); font-size: 19px; font-weight: 700; white-space: nowrap; }
.time-chip { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.time-chip.day { color: var(--sky-day); border-color: #8fb3d955; }
.time-chip.night { color: var(--gold); border-color: #d2ad5f55; }
.seals { display: flex; gap: 3px; align-items: center; }
.seal { width: 18px; height: 22px; }
.seal path { fill: var(--seal); }
.seal.used path { fill: none; stroke: #d43c4c55; stroke-width: 1.2; }
.mini { display: flex; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.mini span b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }

/* ---------- 中央 ---------- */
.main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-block: 18px 28px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }

.scene-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.4; margin: 0 0 4px;
  text-wrap: balance; }
.scene-sub { font-size: 12px; letter-spacing: .14em; color: var(--gold); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.scene-sub::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, #d2ad5f66, transparent); }
.scene-body p, .scene-body .para { margin: 0 0 12px; }
.scene-body .para p { margin: 8px 0 0; }
.scene-body .quote { font-family: var(--font-display); font-size: 16px; padding: 10px 14px; border-left: 2px solid var(--gold);
  background: var(--gold-soft); border-radius: 0 6px 6px 0; }
.scene-body .note { font-size: 13px; color: var(--muted); }
.scene-body .news { font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--bg-2); }

.chk { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: baseline; font-size: 12px; padding: 3px 10px;
  border-radius: 6px; font-variant-numeric: tabular-nums; }
.chk.ok { background: #67c2941f; color: var(--ok); border: 1px solid #67c29455; }
.chk.ng { background: #e2716f1f; color: var(--ng); border: 1px solid #e2716f55; }
.chk em { font-style: normal; color: var(--muted); }

.choices { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.choice { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left;
  padding: 13px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-3); cursor: pointer;
  min-height: 52px; transition: border-color .15s, background .15s, transform .08s; }
.choice:hover { border-color: #d2ad5f88; }
.choice:active { transform: scale(.985); }
.choice:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.choice .c-label { font-weight: 500; }
.choice .c-hint { font-size: 11px; color: var(--muted); text-align: right; flex: none; max-width: 45%; line-height: 1.4; }
.choice[disabled] { opacity: .4; cursor: not-allowed; }
.choice.primary { background: linear-gradient(180deg, #2a2440, #1d1a30); border-color: #d2ad5f77; }
.choice.danger { border-color: #d43c4c88; background: linear-gradient(180deg, #2c1820, #1d1420); }
.choice.danger .c-label { color: #f3b7bd; }

/* ---------- 下部タブ ---------- */
.tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: #0c0e19f2;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.tab { background: none; border: 0; padding: 9px 0 8px; font-size: 11px; color: var(--muted); cursor: pointer; display: flex;
  flex-direction: column; align-items: center; gap: 2px; letter-spacing: .06em; }
.tab svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.tab.on { color: var(--gold); }
.tab:focus-visible { outline: 2px solid var(--gold); outline-offset: -4px; }
.tab .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--seal); position: absolute; margin-left: 18px; }

/* ---------- パネル共通 ---------- */
.panel h2 { font-family: var(--font-display); font-size: 20px; margin: 0 0 2px; }
.panel h3 { font-size: 12px; letter-spacing: .14em; color: var(--gold); margin: 22px 0 8px; font-weight: 500; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 3.2em 1fr 2.6em; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: #ffffff12; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--fg); border-radius: 3px; }
.bar.hp i { background: var(--ok); }
.bar.mp i { background: #7aa2e8; }
.bar.bond i { background: linear-gradient(90deg, var(--seal), var(--gold)); }
.bar.enemy i { background: var(--ng); }
.tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin: 2px 4px 2px 0; }
.tag.gold { color: var(--gold); border-color: #d2ad5f66; }
.tag.red { color: #f3b7bd; border-color: #d43c4c77; }
.tag.green { color: var(--ok); border-color: #67c29466; }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }

/* ---------- Fate式パラメータ表 ---------- */
.params { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.param { background: var(--bg-2); padding: 8px 10px 9px; min-width: 0; }
.param .pl { font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.param .pr { font-family: var(--font-rank); font-size: 22px; font-weight: 600; line-height: 1.2; color: var(--fg); }
.param .pr small { font-family: var(--font-body); font-size: 10px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.param .pr.up { color: var(--ok); }
.param .pr.down { color: var(--ng); }
.param .bar { margin-top: 4px; height: 3px; }
.param .bar i { background: var(--gold); }

/* ---------- サーヴァントカード ---------- */
.svcard { border: 1px solid #d2ad5f55; border-radius: 14px; padding: 16px; background:
  linear-gradient(160deg, #221d36 0%, #141829 60%); position: relative; overflow: hidden; }
.svcard::before { content: ""; position: absolute; right: -60px; top: -60px; width: 180px; height: 180px; border-radius: 50%;
  border: 1px solid #d2ad5f33; box-shadow: 0 0 0 14px #d2ad5f0d, 0 0 0 30px #d2ad5f08; }
.svclass { font-family: var(--font-rank); font-size: 12px; letter-spacing: .3em; color: var(--gold); }
.svname { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.35; margin: 2px 0 4px; text-wrap: balance; }
.np { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.np .np-name { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.np .np-ruby { font-size: 11px; color: var(--gold); letter-spacing: .08em; }

/* ---------- 陣営一覧 ---------- */
.rivals { display: flex; flex-direction: column; gap: 10px; }
.rival { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--bg-2); }
.rival.out { opacity: .5; }
.rival-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rival-cls { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.rival p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.intel { display: flex; gap: 3px; }
.intel i { width: 14px; height: 4px; border-radius: 2px; background: #ffffff1a; }
.intel i.on { background: var(--gold); }

/* ---------- 戦闘 ---------- */
.battle-field { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 14px; }
.fighter { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg-2); }
.fighter.enemy { border-color: #d43c4c55; }
.fighter-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.fighter-name { font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.fighter .bar { margin-top: 6px; height: 8px; }
.vs { text-align: center; font-family: var(--font-rank); color: var(--seal); letter-spacing: .4em; font-size: 12px; }
.tell { font-size: 13px; padding: 8px 12px; border-radius: 8px; background: #d43c4c14; border: 1px solid #d43c4c44; color: #f3c9cd; }
.blog { font-size: 13px; color: var(--muted); border-left: 1px solid var(--line); padding-left: 10px; margin-top: 10px; }
.blog p { margin: 0 0 6px; }

/* ---------- タイトル・召喚 ---------- */
.title-wrap { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding-block: 12px; }
.circle { width: min(78vw, 300px); aspect-ratio: 1; max-width: 100%; margin: 0 auto; display: block; }
.circle .ring { fill: none; stroke: var(--gold); stroke-width: .6; opacity: .75; }
.circle .ring.red { stroke: var(--seal); opacity: .9; }
.circle .spin { transform-origin: 50% 50%; animation: spin 60s linear infinite; }
.circle .spin.rev { animation-duration: 90s; animation-direction: reverse; }
.circle text { font-family: var(--font-rank); font-size: 4.2px; fill: var(--gold); letter-spacing: 1.2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.game-title { font-family: var(--font-display); font-size: 34px; font-weight: 800; text-align: center; letter-spacing: .08em; margin: 0; line-height: 1.3; }
.game-title small { display: block; font-size: 12px; letter-spacing: .5em; color: var(--gold); font-weight: 500; margin-bottom: 6px; }
.lead { color: var(--muted); font-size: 13px; text-align: center; margin: 0 auto; max-width: 30em; }
.summon-glow { animation: glow 1.6s ease-out both; }
@keyframes glow { 0% { filter: drop-shadow(0 0 0 #d2ad5f00); opacity: .3; transform: scale(.85); }
  60% { filter: drop-shadow(0 0 22px #d2ad5fcc); opacity: 1; } 100% { filter: drop-shadow(0 0 8px #d2ad5f66); transform: scale(1); } }
.reveal { animation: reveal .8s ease-out both; animation-delay: .6s; }
@keyframes reveal { from { opacity: .0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.field { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; }
.field label { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.field input { font: inherit; background: var(--bg-3); border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 10px 12px; width: 100%; }
.field input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
.birth-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--bg-2); }
.birth-name { font-family: var(--font-display); font-size: 19px; font-weight: 700; }

.log-list { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.log-list div { display: grid; grid-template-columns: 4.5em 1fr; gap: 10px; }
.log-list span { color: var(--muted); font-variant-numeric: tabular-nums; }

.ending-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.ending-stats div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg-2); font-size: 12px; color: var(--muted); }
.ending-stats b { display: block; font-size: 16px; color: var(--fg); font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  .circle .spin, .summon-glow, .reveal { animation: none; }
  .choice { transition: none; }
}

/* ---------- 行動選択の状況パネル ---------- */
.status-box { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 4px 0 6px; }
.status-box > div { background: var(--bg-2); padding: 6px 8px; font-size: 11px; color: var(--muted); min-width: 0; }
.status-box > div span { display: block; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status-box b { font-size: 17px; color: var(--fg); font-weight: 700; font-variant-numeric: tabular-nums; }
.status-box em { font-style: normal; margin-left: 2px; }
.status-box .wide { grid-column: 1 / -1; font-size: 12px; line-height: 1.6; }
.status-box .wide span { display: inline; margin-right: 4px; color: var(--gold); }

/* ---------- 道具一覧 ---------- */
.item-list { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.item-list div { display: flex; flex-direction: column; border-left: 2px solid #d2ad5f66; padding-left: 10px; }
.item-list b { font-weight: 500; color: var(--fg); }
.item-list span { font-size: 12px; color: var(--muted); }

/* ---------- 戦闘：マスターの行動 ---------- */
.mact { margin: 12px 0 4px; }
.mact-head { font-size: 12px; letter-spacing: .12em; color: var(--gold); display: flex; justify-content: space-between; margin-bottom: 6px; }
.mact-head span { color: var(--muted); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.mact-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: flex; flex-direction: column; align-items: flex-start; gap: 0; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg-2); font-size: 13px; cursor: pointer; line-height: 1.35; min-height: 44px; justify-content: center; }
.chip small { font-size: 10px; color: var(--muted); }
.chip.on { border-color: var(--gold); background: var(--gold-soft); color: var(--gold); }
.chip[disabled] { opacity: .35; cursor: not-allowed; }
.chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.enemy-params { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: 11px; color: var(--muted); }
.enemy-params b { font-family: var(--font-rank); color: var(--fg); margin-left: 3px; font-weight: 600; }
.note.rule { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

</style>
<div id="app"></div>
<script>

// ---- ランク → 数値 ----
// 判定では「数値 + サイコロ」で勝負します。
function rankValue(r) {
  if (!r) return 0;
  if (r === '？') return 40;      // 不明：Bランク相当として扱う
  if (r === '－' || r === 'なし') return 30;
  const base = { E: 10, D: 20, C: 30, B: 40, A: 50, EX: 65 };
  const m = r.match(/^(EX|[A-E])(\+*)(-*)$/);
  if (!m) return 30;
  return base[m[1]] + m[2].length * 5 - m[3].length * 3;
}
// 数値 → 表示用ランク（マスター補正後の表示に使う）
function valueRank(v) {
  if (v >= 65) return 'EX';
  const table = [[60, 'A++'], [55, 'A+'], [50, 'A'], [45, 'B+'], [40, 'B'], [35, 'C+'], [30, 'C'], [25, 'D+'], [20, 'D'], [15, 'E+'], [0, 'E']];
  for (const [t, r] of table) if (v >= t) return r;
  return 'E';
}

// ---- クラス相性（FGOの三すくみをベースに簡略化） ----
// 戻り値: 攻撃側から見た補正値
function classAffinity(atk, def) {
  const adv = {
    'セイバー': ['ランサー'], 'ランサー': ['アーチャー'], 'アーチャー': ['セイバー'],
    'ライダー': ['キャスター'], 'キャスター': ['アサシン'], 'アサシン': ['ライダー'],
    'アヴェンジャー': ['ルーラー'], 'ルーラー': [],
  };
  if (atk === 'バーサーカー' || def === 'バーサーカー') return 6;   // 狂戦士は与える・受ける両方が大きい
  if ((adv[atk] || []).includes(def)) return 8;
  if ((adv[def] || []).includes(atk)) return -8;
  return 0;
}

//  core.js … ゲームの土台（状態・判定・時間の進行・イベント表示）
//  大まかな流れ：
//   タイトル → 産まれの決定 → 準備期間（5日） → 召喚の夜
//   → 聖杯戦争（最大14日） → 天降山の決戦 → 聖杯 → エンディング
//  1日は「昼」と「夜」の2コマ。コマごとに行動を1つ選びます。
//  1プレイの目安は30分前後です。
// =============================================================

const SAVE_KEY = 'fukami-grail-war-v2';
const PREP_DAYS = 5;
const WAR_DAYS = 14;
const FINAL_DAY = 11;   // 天降山の決戦はこの日の夜以降
const EVENT_CHANCE = { prep: 0.25, war: 0.22 };   // コマの始めにランダムイベントが起きる確率
const STAT_LABEL = { mag: '魔力', phy: '体力', int: '知力', spi: '精神', cha: '交渉', luk: '幸運' };
const CLASS_EN = { 'セイバー': 'SABER', 'アーチャー': 'ARCHER', 'ランサー': 'LANCER', 'ライダー': 'RIDER',
  'キャスター': 'CASTER', 'アサシン': 'ASSASSIN', 'バーサーカー': 'BERSERKER', 'ルーラー': 'RULER', 'アヴェンジャー': 'AVENGER', '聖杯': 'GRAIL' };

// 道具（買い出しで入手。主に戦闘中に「マスターの行動」として使う）
const ITEMS = {
  potion:  { name: '治癒の霊薬', cost: 2, desc: '戦闘中、サーヴァントのHPを35回復' },
  gem:     { name: '魔力を込めた宝石', cost: 3, desc: '戦闘中、宝石魔術で援護（その手番+12・敵に10ダメージ）' },
  crystal: { name: '魔力結晶', cost: 2, desc: 'サーヴァントの魔力を40回復（戦闘中も使える）' },
  smoke:   { name: '煙幕の護符', cost: 1, desc: '戦闘から確実に撤退できる' },
};
const ITEM_MAX = 3;

let G = null;          // ゲームの状態（セーブされる）
let SCENE = null;      // 今表示している場面（セーブしない）
let TAB = 'story';     // 選択中のタブ
let NOTES = [];        // 判定結果などに付け足す小さな注記
let LAST_HUB = null;   // 最後に行動選択画面へ戻った時点のセーブデータ
let SLOT = {};         // このコマで済ませた処理（ニュース・物語・イベント）

// ---------------- 小さな道具 ----------------
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function wpick(items, wf) {
  const ws = items.map(wf); const total = ws.reduce((s, w) => s + w, 0);
  let r = Math.random() * total;
  for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SV_BY_ID = Object.fromEntries(SERVANTS.concat([BOSS]).map(s => [s.id, s]));

// ---------------- 名前・参照 ----------------
function M() { return esc(G.master.name); }
function servantOf(o) { return SV_BY_ID[o.servantId || (o.servant && o.servant.id)]; }
function SV() { return G.servant ? servantOf(G).short : 'サーヴァント'; }
const SVname = SV;
function birthOf() { return BIRTHS.find(x => x.id === G.master.birth); }
function fmt(s) { return s.replaceAll('{m}', M()).replaceAll('{s}', SV()); }
function aliveRivals() { return (G.rivals || []).filter(r => r.alive); }
function hostileRivals() { return aliveRivals().filter(r => !r.ally); }
function randomAliveRival() { return pick(aliveRivals()); }
function randomHostile() { return pick(hostileRivals()); }
// 今戦える敵（天降山に籠城した最後の陣営は除く）
function engageable() { return hostileRivals().filter(r => !r.siege); }
function rivalLabel(r) { return r.intel >= 3 ? servantOf(r).short : r.cls; }
function isAssassin() { return G.servant && servantOf(G).cls === 'アサシン'; }

// ---------------- 状態を変える関数（イベントからも使う） ----------------
function note(t) { NOTES.push(t); }
function gain(stat, n) { const st = G.master.stats; st[stat] = clamp(st[stat] + n, 1, 100); }
function money(n) { G.master.money = Math.max(0, G.master.money + n); }
function hp(n) { G.master.hp = clamp(G.master.hp + n, 0, G.master.hpMax); }
function od(n) { G.master.od = clamp(G.master.od + n, 0, odMax()); }
function odMax() { return 20 + Math.floor(G.master.stats.mag * 0.6); }
function shp(n) { if (G.servant) G.servant.hp = clamp(G.servant.hp + n, 0, servantHpMax()); }
function mp(n) { if (G.servant) G.servant.mp = clamp(G.servant.mp + n, 0, 100); }
function item(k, n) { G.items[k] = clamp((G.items[k] || 0) + n, 0, ITEM_MAX); }
function bond(n) {
  if (!G.servant || n === 0) return;
  if (n > 0 && G.master.birth === 'civilian') n = Math.round(n * 1.3);
  const before = Math.floor(G.servant.bond / 10);
  G.servant.bond = clamp(G.servant.bond + n, 0, 100);
  const after = Math.floor(G.servant.bond / 10);
  if (after > before) note(`<span class="tag gold">絆Lv ${after} に上昇</span>`);
}

// 選択肢の「傾向」：マスターの属性が動き、サーヴァントの好き嫌いで絆も変わる
function tone(t) {
  const a = G.master.align;
  if (t === 'good') a.good = clamp(a.good + 8, -100, 100);
  if (t === 'evil') a.good = clamp(a.good - 8, -100, 100);
  if (t === 'law') a.law = clamp(a.law + 8, -100, 100);
  if (t === 'chaos') a.law = clamp(a.law - 8, -100, 100);
  if (!G.servant) return;
  const sv = servantOf(G); const [order, moral] = sv.align.split('・');
  let d = 0;
  if (order === '秩序') d += t === 'law' ? 2 : t === 'chaos' ? -2 : 0;
  if (order === '混沌') d += t === 'chaos' ? 2 : t === 'law' ? -1 : 0;
  if (moral === '善') d += t === 'good' ? 2 : t === 'evil' ? -3 : 0;
  if (moral === '悪') d += t === 'evil' ? 2 : 0;
  const bold = ['warrior', 'king', 'free'].includes(sv.persona);
  const calm = ['cool', 'scholar'].includes(sv.persona);
  if (t === 'cautious') d += calm ? 1 : bold ? -1 : 0;
  if (t === 'bold') d += bold ? 1 : calm ? -1 : 0;
  if (d > 0) { bond(d); note(`<span class="note">${SV()}は好ましく思ったようだ。（絆+${d}）</span>`); }
  if (d < 0) { bond(d); note(`<span class="note">${SV()}は少し不満そうだ。（絆${d}）</span>`); }
}
function alignLabel(a = G.master.align) {
  const o = a.law > 25 ? '秩序' : a.law < -25 ? '混沌' : '中立';
  const m = a.good > 25 ? '善' : a.good < -25 ? '悪' : '中庸';
  return `${o}・${m}`;
}

// ---------------- 判定 ----------------
// マスター判定：能力値 + サイコロ(1〜45) が 目標値 以上なら成功
function chk(stat, diff) {
  let v = G.master.stats[stat];
  if (stat === 'spi' && G.master.birth === 'fallen') v += 5;
  const roll = rand(1, 45); const total = v + roll; const ok = total >= diff;
  return { ok, margin: total - diff, text: `<span class="chk ${ok ? 'ok' : 'ng'}">【${STAT_LABEL[stat]}判定】${ok ? '成功' : '失敗'} <em>${v}+${roll}=${total} / 目標${diff}</em></span>` };
}
// サーヴァント判定：パラメータ（ランクを数値化）+ サイコロ
function schk(i, diff) {
  const v = servantParam(i); const roll = rand(1, 45); const total = v + roll; const ok = total >= diff;
  return { ok, margin: total - diff, text: `<span class="chk ${ok ? 'ok' : 'ng'}">【${SV()}・${PARAM_NAMES[i]}判定】${ok ? '成功' : '失敗'} <em>${v}+${roll}=${total} / 目標${diff}</em></span>` };
}

// マスターの魔力がサーヴァントの性能に影響する（Fateの設定に準拠）
function masterCorrection() {
  const m = G.master.stats.mag;
  if (m < 25) return -8; if (m < 40) return -4; if (m < 70) return 0; if (m < 85) return 3; return 5;
}
function servantParam(i) {
  const base = rankValue(servantOf(G).p[i]);
  return i === 4 ? base : Math.max(5, base + masterCorrection());
}
function servantHpMax() { return 70 + rankValue(servantOf(G).p[1]); }
function rivalParam(r, i) { const base = rankValue(servantOf(r).p[i]); return i === 4 ? base : base + (r.power - 6); }

// ---------------- 新しいゲーム ----------------
function randomName(foreign) {
  return foreign ? `${pick(NAMES.foreignGiven)}・${pick(NAMES.foreignFamily)}` : `${pick(NAMES.family)} ${pick(NAMES.given)}`;
}
function rollMaster(name) {
  const b = wpick(BIRTHS, x => x.weight);
  const stats = {};
  for (const k in b.stats) stats[k] = clamp(b.stats[k] + rand(-8, 8), 5, 95);
  return {
    name: name || randomName(false), birth: b.id, stats, hp: 100, hpMax: 100, money: b.money + rand(0, 3),
    seals: 3, od: 0, align: { law: rand(-20, 20), good: rand(-10, 25) },
    element: wpick(ELEMENTS, e => e.w).name, circuits: rand(b.circuits[0], b.circuits[1]),
    age: rand(16, 34),
  };
}
function newGame(master) {
  G = {
    v: 2, phase: 'prep', day: 1, slot: 0, master, servant: null,
    catalysts: [], items: { potion: 1, gem: 0, crystal: 0, smoke: 1 }, flags: {}, used: {}, rivals: [], log: [], news: [],
    ritual: 0, workshop: 0, traps: 0, kills: 0, battles: 0, tmpRival: null, storyRival: null,
  };
  G.master.od = odMax();
  if (master.birth === 'noble') giveCatalyst();
  if (master.birth === 'mercenary') { item('gem', 1); item('smoke', 1); }
  if (master.birth === 'clocktower') item('crystal', 1);
  addLog(`${master.name}、深見市にて聖杯戦争への参加を決意する。`);
}
function addLog(t) { G.log.unshift({ when: whenShort(), text: t }); if (G.log.length > 80) G.log.pop(); }
function whenShort() {
  if (G.phase === 'prep') return `準備${G.day}日`;
  if (G.phase === 'war') return `${G.day}日目${G.slot ? '夜' : '昼'}`;
  return '―';
}

// 触媒：まだ持っていない英霊の触媒からランダムに1つ
function giveCatalyst() {
  const owned = new Set(G.catalysts);
  const pool = SERVANTS.filter(s => s.catalyst && !owned.has(s.id));
  const s = pick(pool); G.catalysts.push(s.id);
  addLog(`触媒「${s.catalyst}」を入手。`);
  return s.catalyst;
}
function pickVisionServant() {
  if (!G.flags.vision) G.flags.vision = pick(SERVANTS).id;
  return SV_BY_ID[G.flags.vision];
}

// ---------------- セーブ / ロード ----------------
function saveGame() {
  LAST_HUB = JSON.stringify(G);
  try { localStorage.setItem(SAVE_KEY, LAST_HUB); } catch (e) { /* 保存できない環境でも遊べるように無視 */ }
}
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } LAST_HUB = null; }

// =============================================================
//  場面（シーン）の表示
// =============================================================
// scene({ title, sub, body:[段落...], choices:[{label, hint, fn, cls, disabled}] })
function scene(s) { SCENE = s; TAB = 'story'; render(); const m = document.querySelector('.main'); if (m) m.scrollTop = 0; }
function next(title, body, fn, label = '次へ', sub) {
  scene({ title, sub, body, choices: [{ label, fn, cls: 'primary' }] });
}
function takeNotes() { const n = NOTES; NOTES = []; return n; }
function paras(list) { return list.filter(Boolean).map(p => p.startsWith('<p') || p.startsWith('<div') ? p : `<div class="para">${p}</div>`); }

// =============================================================
//  時間の進行
// =============================================================
function phaseLabel() {
  if (!G) return '';
  if (G.phase === 'prep') return '準備期間';
  if (G.phase === 'summon') return '召喚の夜';
  if (G.phase === 'war') return '聖杯戦争';
  return '終幕';
}
function isNight() { return G.slot === 1; }

// コマの始まり：ニュース → 物語 → 決戦判定 → ランダムイベント → 行動選択
function startSlot() {
  if (checkGameOver()) return;
  if (G.phase === 'prep' && G.day > PREP_DAYS) { G.phase = 'summon'; return summonScene(); }
  if (G.phase === 'war') {
    if (aliveRivals().length === 0) return victoryScene();
    if (hostileRivals().length === 0) return breakAlliance();
  }
  if (!SLOT.news && G.news.length && G.slot === 0) {
    SLOT.news = true;
    const n = G.news.splice(0);
    return next('昨夜の出来事', n.map(t => `<p class="news">${t}</p>`), startSlot, '次へ', 'NEWS');
  }
  if (!SLOT.story) {
    SLOT.story = true;
    const beat = STORY.find(s => s.phase === G.phase && s.day === G.day && s.slot === G.slot && !G.used[s.id] && (!s.cond || s.cond()));
    if (beat) return showEvent(beat, beat.after === 'advance' ? advance : startSlot);
  }
  if (G.phase === 'war' && aliveRivals().length === 1) {
    const last = aliveRivals()[0];
    if (isNight() && G.day >= FINAL_DAY) return finalBattleIntro();
    if (!last.siege) return siegeScene(last);
  }
  if (!SLOT.event) {
    SLOT.event = true;
    if (Math.random() < EVENT_CHANCE[G.phase]) { const ev = drawEvent(); if (ev) return showEvent(ev, startSlot); }
  }
  hub();
}
function advance() {
  if (checkGameOver()) return;
  SLOT = {};
  G.slot++;
  if (G.slot > 1) { G.slot = 0; G.day++; dailyUpdate(); }
  if (G.phase === 'war' && G.day > WAR_DAYS) return deadlineScene();
  startSlot();
}
function dailyUpdate() {
  hp(10); od(Math.ceil(odMax() * 0.6));
  if (G.phase === 'war' && G.servant) {
    mp(15 + Math.floor(G.master.stats.mag * 0.3) + G.workshop * 5);
    shp(10 + G.workshop * 3);
    for (const r of aliveRivals()) { r.hp = Math.min(r.hpMax, r.hp + 18); r.mp = Math.min(100, r.mp + 30); }
    simulateRivals();
  }
}

// ライバル同士の戦い（画面外で進む）
function simulateRivals() {
  const alive = aliveRivals();
  if (alive.length < 3 || G.day < 3) return;   // 最後の2陣営はプレイヤーと決着をつける
  const p = 0.1 + G.day * 0.015;
  if (Math.random() > p) return;
  const [a, b] = shuffle(alive).slice(0, 2);
  const power = r => [0, 1, 2, 3, 5].reduce((s, i) => s + rivalParam(r, i), 0) / 5 + r.power + r.hp / 8 + rand(0, 30);
  const [win, lose] = power(a) >= power(b) ? [a, b] : [b, a];
  lose.alive = false; lose.hp = 0;
  win.hp = Math.max(20, win.hp - rand(20, 50)); win.clues = (win.clues || 0) + (Math.random() < 0.5 ? 1 : 0);
  const place = pick(['港の倉庫街', '城跡公園', '御影川の河川敷', '天降山の山道', '駅前の再開発地区']);
  G.news.push(`昨夜、${place}で激しい戦闘があった。<b>${rivalLabel(lose)}陣営</b>が脱落したようだ。` +
    (win.intel >= 1 ? `勝ったのは${rivalLabel(win)}陣営らしい。手負いのはずだ。` : ''));
  addLog(`${rivalLabel(lose)}陣営が${rivalLabel(win)}陣営に敗れ脱落。`);
}

function checkGameOver() {
  if (!G || G.phase === 'end') return true;
  if (G.master.hp <= 0) { ending('dead'); return true; }
  return false;
}

// =============================================================
//  イベント（ランダム・物語共通）
// =============================================================
function drawEvent(forceTime) {
  const t = forceTime || (isNight() ? 'night' : 'day');
  const ph = G.phase;
  const list = EVENTS.filter(e =>
    (e.phase === 'any' || e.phase === ph) &&
    (e.time === 'any' || e.time === t) &&
    !(e.once && G.used[e.id]) &&
    (!e.cond || e.cond()));
  if (!list.length) return null;
  return wpick(list, e => e.weight || 1);
}
// after：結果を読んだ後に進む先（advance＝コマを使い切る / startSlot＝行動選択へ）
function showEvent(ev, after = advance) {
  G.used[ev.id] = true;
  const text = typeof ev.text === 'function' ? ev.text() : ev.text;
  const choices = ev.choices
    .filter(c => !c.cond || c.cond())
    .map(c => ({
      label: typeof c.label === 'function' ? c.label() : c.label, hint: c.hint, cls: c.cls,
      fn: () => {
        NOTES = [];
        const res = c.run();
        let body = [], then = null;
        if (res && res.text !== undefined) { body = [].concat(res.text); then = res.then; } else body = [].concat(res);
        body = paras(body.concat(takeNotes()));
        next(ev.title, body, then || after, then ? '次へ' : '次へ', ev.chapter ? 'STORY' : 'EVENT');
      },
    }));
  if (!choices.length) choices.push({ label: '次へ', fn: after });
  scene({ title: ev.title, sub: ev.chapter || 'EVENT', body: paras([text]), choices });
}

// =============================================================
//  actions.js … 行動選択（ハブ）と、各行動の中身
//  聖杯戦争中は「何を優先するか」が戦略になります。
//   情報（真名を暴く） / 陣地（守りを固める） / 道具（戦闘の切り札）
//   絆（サーヴァントの力を引き出す） / 攻勢（敵を減らす）
// =============================================================

function hub() {
  G.tmpRival = null;
  saveGame();
  const flavor = pick(FLAVOR[isNight() ? 'night' : 'day']);
  const body = [`<p>${flavor}</p>`];
  let acts;
  if (G.phase === 'prep') {
    body.push(`<p class="note">召喚の夜まで、あと${PREP_DAYS - G.day + 1}日。能力を鍛え、触媒を探し、召喚陣を整えよう。</p>`);
    acts = isNight() ? prepNightActions() : prepDayActions();
  } else {
    body.push(statusLine());
    const last = aliveRivals().find(r => r.siege);
    if (last) body.push(`<p class="note">最後の敵・${rivalLabel(last)}陣営は天降山に籠城している。決戦は<b>${FINAL_DAY}日目の夜</b>。それまでに力を蓄えよう。</p>`);
    else if (G.day >= FINAL_DAY - 2) body.push(`<p class="note">聖杯の降臨が近い。残り一陣営になれば、${FINAL_DAY}日目以降の夜に天降山で決戦となる。</p>`);
    acts = isNight() ? warNightActions() : warDayActions();
  }
  scene({ title: isNight() ? '夜の行動' : '昼の行動', sub: `${phaseLabel()}・${G.day}日目`, body, choices: acts });
}
function statusLine() {
  const sv = G.servant; const allies = aliveRivals().length - hostileRivals().length;
  const items = Object.keys(ITEMS).filter(k => G.items[k]).map(k => `${ITEMS[k].name}×${G.items[k]}`).join('　') || 'なし';
  return `<div class="status-box">
    <div><span>敵陣営</span><b>${hostileRivals().length}</b>${allies ? `<em>同盟${allies}</em>` : ''}</div>
    <div><span>${SV()}</span><b>${sv.hp}</b><em>/${servantHpMax()}</em></div>
    <div><span>英霊の魔力</span><b>${sv.mp}</b></div>
    <div><span>オド</span><b>${G.master.od}</b><em>/${odMax()}</em></div>
    <div class="wide"><span>陣地</span>Lv${G.workshop}・罠${G.traps}　<span>道具</span>${items}</div>
  </div>`;
}
// 行動の結果を表示して、コマを進める
function actResult(title, fn) {
  NOTES = [];
  const res = [].concat(fn()).filter(Boolean).concat(takeNotes());
  next(title, paras(res), advance);
}
// サブメニュー（「やめる」で行動選択に戻る）
function submenu(title, sub, text, choices) {
  choices.push({ label: 'やめる', fn: hub });
  scene({ title, sub, body: paras([].concat(text)), choices });
}

// =============================================================
//  準備期間
// =============================================================
function prepDayActions() {
  return [
    { label: '体を鍛える', hint: '体力↑ 精神↑', fn: () => actResult('鍛錬', () => { const n = rand(3, 5); gain('phy', n); gain('spi', 1);
      return `早朝の御影川の河川敷を走り込んだ。（体力+${n} 精神+1）`; }) },
    { label: '魔術の修練', hint: '魔力↑（精神判定）', fn: () => actResult('魔術の修練', studyMagic) },
    { label: '書庫で調べもの', hint: '知力↑ 触媒の手がかり', fn: () => actResult('調べもの', () => {
      const n = rand(3, 5); gain('int', n);
      if (Math.random() < 0.2) { const c = giveCatalyst(); return [`市立図書館の郷土資料室で調べものをした。（知力+${n}）`, `古い寄贈品目録を辿り、<b>${c}</b>の在処を突き止めて入手した！`]; }
      return `市立図書館で英霊の伝承を調べた。（知力+${n}）`; }) },
    { label: '街を歩く', hint: '出来事が起きやすい', fn: () => walkTown('day') },
    { label: 'アルバイト', hint: '資金↑ 交渉↑', fn: () => actResult('アルバイト', () => { const n = rand(2, 3); money(n); gain('cha', 1);
      return `駅前の喫茶店で働いた。（資金+${n}万円 交渉+1）`; }) },
    { label: '買い出し', hint: '霊薬・宝石などの道具', fn: shopMenu },
  ];
}
function prepNightActions() {
  return [

function studyMagic() {
  const r = chk('spi', 45);
  if (r.ok) { const n = rand(3, 5); gain('mag', n); gain('int', 1); return [r.text, `魔術回路を酷使し、術式の精度を高めた。（魔力+${n} 知力+1）`]; }
  hp(-10); gain('mag', 1); return [r.text, '魔力の制御を誤り、回路が焼けるように痛んだ。（HP-10 魔力+1）'];
}
function walkTown(t) {
  const ev = drawEvent(t);
  if (ev && Math.random() < 0.85) return showEvent(ev, advance);
  actResult('散策', () => { gain('luk', 1); return `${pick(CITY.places)}を歩いた。特に何も起きなかったが、街の地理に詳しくなった。（幸運+1）`; });
}

// ---- 買い出し（何個か買ってからコマを終える） ----
function shopMenu(bought = 0) {
  const choices = Object.entries(ITEMS).map(([k, it]) => ({
    label: `${it.name}を買う`, hint: `${it.cost}万円・所持${G.items[k] || 0}/${ITEM_MAX}`,
    disabled: G.master.money < it.cost || (G.items[k] || 0) >= ITEM_MAX,
    fn: () => { money(-it.cost); item(k, 1); shopMenu(bought + 1); },
  }));
  if (bought) choices.push({ label: '買い物を終える', cls: 'primary', fn: advance });
  else choices.push({ label: 'やめる', fn: hub });
  scene({ title: '買い出し', sub: 'SHOP', body: [
    `<p>旧城下町の裏通りに、魔術師向けの品を扱う店がある。所持金は<b>${G.master.money}万円</b>。</p>`,
    `<div class="item-list">${Object.values(ITEMS).map(it => `<div><b>${it.name}</b><span>${it.desc}</span></div>`).join('')}</div>`,
    bought ? `<p class="note">${bought}点購入した。</p>` : '',
  ], choices });
}

  const research = hostileRivals().filter(r => r.intel >= 1 && r.intel < 3);
  submenu('情報を集める', 'INTEL', [
    '<p>どうやって探る？　情報は①マスター判明 → ②拠点判明（襲撃できる） → ③真名判明（戦闘で大きく有利）の順に進む。</p>',
  ], [
    { label: '街で聞き込み', hint: `交渉判定（交渉${G.master.stats.cha}）`, fn: () => actResult('聞き込み', () => {
      const r = chk('cha', 55);
      if (!r.ok) return [r.text, '噂話ばかりで、有力な手がかりは得られなかった。'];
      return [r.text, intelRandom(1) || 'これ以上、新しい情報は見つからなかった。'];
    }) },
    { label: '使い魔を放つ', hint: `魔力判定・オド-10（残${G.master.od}）`, disabled: G.master.od < 10, fn: () => actResult('使い魔', () => {
      od(-10); const r = chk('mag', 58);
      if (!r.ok) return [r.text, '使い魔は他陣営の結界に焼かれてしまった。'];
      const t = [intelRandom(1)]; if (r.margin >= 20) t.push(intelRandom(1));
      return [r.text, '鴉の使い魔が、夜通し街を見張ってくれた。', ...t.filter(Boolean)];
    }) },
    { label: '文献で真名を探る', hint: research.length ? '知力判定・戦った相手ほど易しい' : '対象なし（マスター判明が必要）', disabled: !research.length, fn: researchMenu },
    { label: '教会を頼る', hint: G.flags.registered ? (can ? '確実に情報が得られる（3日に1度）' : '数日待つ必要がある') : '教会への登録が必要', disabled: !can, fn: () => actResult('教会', () => {
      G.flags.churchDay = G.day;
      const r = hostileRivals().filter(x => x.intel < 3).sort((a, b) => a.intel - b.intel)[0];
      if (!r) return `${CAST.sister}は首を振った。「お伝えできることは、もうありません」`;
      r.intel = Math.min(3, r.intel + 1);
      return [`${CAST.sister}は少し迷ってから、資料を一枚差し出した。「……公平を期すため、です」`, intelText(r)];
    }) },
  ]);
}
function researchMenu() {
  const list = hostileRivals().filter(r => r.intel >= 1 && r.intel < 3);
  submenu('文献調査', 'RESEARCH', '<p>どの陣営のサーヴァントを調べる？　戦ったり、見切ったりした回数（手がかり）が多いほど成功しやすい。</p>',
    list.map(r => {
      const diff = researchDiff(r);
      return { label: `${r.cls}を調べる`, hint: `目標${diff}・手がかり${r.clues || 0}`, fn: () => actResult('文献調査', () => {
        const c = chk('int', diff);
        if (!c.ok) { r.clues = (r.clues || 0) + 1; return [c.text, '決め手に欠けた。だが、候補はいくつかに絞り込めた。（手がかり+1）']; }
        r.intel = 3; addLog(`${r.cls}の真名「${servantOf(r).name}」を看破。`);
        return [c.text, `伝承と照らし合わせて確信した。${r.cls}の真名は<b>${servantOf(r).name}</b>だ！`, `<span class="note">${servantOf(r).desc}</span>`];
      }) };
    }));
}
function researchDiff(r) { return Math.max(40, 78 - (r.clues || 0) * 8 - (r.intel >= 2 ? 5 : 0)); }

// 情報を1段階進める：1=マスター判明 2=拠点判明 3=真名判明
function intelRandom(n) {
  const cand = aliveRivals().filter(r => r.intel < 3);
  if (!cand.length) return '';
  const r = pick(cand); r.intel = Math.min(3, r.intel + n);
  return intelText(r);
}
function intelText(r) {
  if (r.intel === 1) return `${r.cls}陣営のマスターは<b>${esc(r.master)}</b>――${r.type}だと分かった。`;
  if (r.intel === 2) return `${r.cls}陣営の拠点を突き止めた。夜に襲撃を仕掛けられる。`;
  addLog(`${r.cls}の真名「${servantOf(r).name}」を看破。`);
  return `${r.cls}の真名は<b>${servantOf(r).name}</b>だ！ 伝承から弱点が見えてきた。（戦闘で有利になる）`;
}

    { label: '夜の巡回', hint: none ? '敵は天降山に籠城中' : '慎重 or 挑発。敵を探す', disabled: none, fn: patrolMenu, cls: 'danger' },

// 夜に拠点にいると襲われることがある
function baseAttackChance() { return 0.08 + G.day * 0.01 + (G.servant.exposed ? 0.1 : 0); }
function maybeRaided(after) {
  if (engageable().length && Math.random() < baseAttackChance()) {
    const r = wpick(engageable(), x => x.aggr);
    return next('夜襲', [`<p>結界が軋む音がした。――<b>${rivalLabel(r)}陣営</b>の襲撃だ！ 陣地の力で迎え撃つ。</p>`],
      () => startBattle(r, { defend: true }), '迎え撃つ');
  }
  after();
}

function patrolMenu() {
  submenu('夜の巡回', 'PATROL', '<p>どう動く？</p>', [
    { label: '慎重に探る', hint: '遭遇しにくいが、先に敵を見つけられる', fn: () => patrol('careful') },
    { label: '魔力を隠さず挑発する', hint: '高確率で戦闘・大胆', cls: 'danger', fn: () => patrol('bold') },
  ]);
}
function patrol(mode) {
  const foes = engageable();
  const p = mode === 'bold' ? 0.75 : 0.4;
  if (Math.random() < p && foes.length) {
    const r = wpick(foes, x => 0.5 + x.aggr);
    r.intel = Math.max(r.intel, 1);
    if (mode === 'bold') {
      NOTES = []; tone('bold');
      return next('遭遇', paras([`${pick(CITY.places)}で魔力を解き放つと、すぐに応える気配があった。`,
        `――<b>${rivalLabel(r)}</b>のサーヴァントだ。マスターの${esc(r.master)}の姿もある。`, `<p class="quote">「${r.quote}」</p>`, ...takeNotes()]),
        () => startBattle(r, {}), '戦う');
    }
    return scene({ title: '発見', sub: 'PATROL', body: paras([`${pick(CITY.places)}の暗がりで、先に敵の姿を捉えた。<b>${rivalLabel(r)}</b>陣営だ。まだこちらには気付いていない。`]),
      choices: [
        { label: '奇襲を仕掛ける', hint: '最初の手番に大きな補正', cls: 'danger', fn: () => startBattle(r, { ambush: true }) },
        { label: '尾行して情報を得る', hint: '情報+1', fn: () => actResult('尾行', () => { r.intel = Math.min(3, r.intel + 1); r.clues = (r.clues || 0) + 1;
          return ['気付かれないよう後をつけた。', intelText(r)]; }) },
        { label: 'やり過ごす', fn: () => actResult('巡回', () => { tone('cautious'); return '息を殺して、敵が通り過ぎるのを待った。'; }) },
      ] });
  }
  if (Math.random() < 0.35) { const ev = drawEvent('night'); if (ev) return showEvent(ev, advance); }
  actResult('夜の巡回', () => {
    const t = Math.random() < (G.flags.investigate ? 0.6 : 0.35) ? intelRandom(1) : '';
    return ['静かな夜だった。敵の姿は見当たらない。', t ? '戦いの痕跡を見つけた。' + t : ''];
  });
}

function scoutMenu() {
  const bonus = isAssassin() ? 15 : 0;
  submenu('偵察', 'SCOUT', `<p>${SV()}を単独で偵察に出す。${isAssassin() ? '気配遮断を持つアサシンは偵察が得意だ。' : ''}失敗すると敵に見つかり、不利な状態で戦闘になる。</p>`,
    engageable().map(r => ({
      label: `${rivalLabel(r)}陣営を探る`, hint: `敏捷判定 目標${60 - bonus}・情報${r.intel}/3`, disabled: r.intel >= 3,
      fn: () => {
        NOTES = []; const c = schk(2, 60 - bonus);
        if (c.ok) {
          r.intel = Math.min(3, r.intel + 1); r.clues = (r.clues || 0) + 1;
          const t = [intelText(r)];
          if (c.margin >= 20 && r.intel < 3) { r.intel++; t.push(intelText(r)); }
          return next('偵察', paras([c.text, `夜明け前、${SV()}が戻ってきた。「見てきたぞ」`, ...t]), advance);
        }
        return next('偵察失敗', paras([c.text, `${SV()}の気配が敵に察知された！ ${rivalLabel(r)}陣営が迫ってくる。`]),
          () => startBattle(r, { enemyFirst: true }), '戦う');
      },
    })));
}

function assaultMenu() {
  submenu('襲撃目標', 'ASSAULT', '<p>拠点を突き止めた陣営に仕掛ける。どの陣営を狙う？</p>',
    engageable().filter(r => r.intel >= 2).map(r => ({

    })));
}
function assaultPlan(r) {
  const asn = isAssassin();
  const choices = [
    { label: '正面から攻め込む', hint: '通常の戦闘・大胆', fn: () => { NOTES = []; tone('bold');
      next('襲撃', paras([`${rivalLabel(r)}陣営の拠点へ、正面から踏み込んだ。`, ...takeNotes()]), () => startBattle(r, {}), '戦う'); } },
    { label: '気配を殺して奇襲する', hint: `${SV()}の敏捷判定 目標${asn ? 50 : 62}`, fn: () => {
      const c = schk(2, asn ? 50 : 62);
      if (c.ok) return next('奇襲', paras([c.text, '敵はまだ気付いていない。最初の一撃は、こちらのものだ。']), () => startBattle(r, { ambush: true }), '仕掛ける');
      next('奇襲失敗', paras([c.text, '気付かれた！ 迎撃の構えを取られてしまった。']), () => startBattle(r, { enemyFirst: true }), '戦う');
    } },
    { label: '先に敵の工房を崩す', hint: `マスターの魔力判定 目標60・オド-15`, disabled: G.master.od < 15, fn: () => {
      od(-15); const c = chk('mag', 60);
      if (c.ok) { r.hp = Math.max(10, r.hp - 20); r.power -= 1;
        return next('工房破壊', paras([c.text, `結界の要を撃ち抜いた。敵の陣地が崩れ、${rivalLabel(r)}は魔力の供給を乱されている。（敵HP-20・敵の強さ低下）`]), () => startBattle(r, {}), '攻め込む'); }
      next('工房破壊失敗', paras([c.text, '結界は堅かった。侵入に気付かれた！']), () => startBattle(r, { enemyFirst: true }), '戦う');
    } },
    { label: '敵マスターを暗殺する', hint: `${asn ? '気配遮断・' : ''}敏捷判定 目標${asn ? 58 : 78}・悪`, cls: 'danger', fn: () => {
      NOTES = []; tone('evil'); const c = schk(2, asn ? 58 : 78);
      if (c.ok) {
        r.alive = false; r.hp = 0; r.masterDead = true; G.kills++; addLog(`${rivalLabel(r)}陣営のマスターを暗殺。`);
        return next('暗殺', paras([c.text, `${SV()}の刃が、眠る${esc(r.master)}に届いた。マスターを失った${rivalLabel(r)}は、魔力の供給を断たれ消えていった。`,
          '<span class="note">戦わずに一陣営を落とした。だが、手は血に濡れた。</span>', ...takeNotes()]), advanceOrVictory);
      }
      next('暗殺失敗', paras([c.text, `寸前で敵サーヴァントが割って入った！`, ...takeNotes()]), () => startBattle(r, { enemyFirst: true }), '戦う');
    } },
  ];
  submenu(`${rivalLabel(r)}陣営への襲撃`, 'PLAN', [`<p>作戦を決めよう。${r.intel >= 3 ? `敵の真名は${servantOf(r).name}。` : ''}</p>`], choices);
}
function advanceOrVictory() { if (aliveRivals().length === 0) return victoryScene(); advance(); }

function defendBase() {
  if (Math.random() < 0.5 && engageable().length) {
    const r = wpick(engageable(), x => x.aggr);

function doSummon(catalystId) {
  let sv;
  if (catalystId) sv = SV_BY_ID[catalystId];
  else {
    const a = alignLabel().split('・');
    sv = wpick(SERVANTS, s => {
      const [o, m] = s.align.split('・');
      let w = 1;
      if (o === a[0]) w += 1.5;
      if (m === a[1]) w += 1.5;
      if (!BASE_CLASSES.includes(s.cls)) w *= 0.4;
      if (G.flags.vision === s.id) w *= G.flags.visionStrong ? 6 : 2.5;
      return w;
    });
  }
  G.servant = { id: sv.id, hp: 0, mp: 60 + G.ritual * 13, bond: 5 + G.ritual * 4, special: null, exposed: false };
  G.servant.hp = servantHpMax();
  setupRivals();
  G.phase = 'war'; G.day = 1; G.slot = 0; SLOT = {};
  addLog(`${sv.cls}「${sv.name}」を召喚。`);
  if (G.flags.earlyIntel) intelRandom(1);
  SCENE = { kind: 'summon', sv }; TAB = 'story'; render();
}
function setupRivals() {
  const mine = servantOf(G).cls;
  let classes = BASE_CLASSES.filter(c => c !== mine);
  if (classes.length > 6) classes = shuffle(classes).slice(0, 6);
  const types = shuffle(RIVAL_TYPES);
  G.rivals = classes.map((cls, i) => {
    const pool = SERVANTS.filter(s => s.cls === cls && s.id !== G.servant.id);
    const s = pick(pool); const t = types[i];
    const r = { id: 'r' + i, cls, servantId: s.id, master: randomName(t.foreign), type: t.type, power: t.power + rand(-1, 1),
      aggr: t.aggr, quote: t.quote, alive: true, hp: 0, hpMax: 0, mp: 100, intel: 0, clues: 0, seals: 2 + rand(0, 1),
      ally: false, bounty: false, masterDead: false };
    r.hpMax = r.hp = 70 + rankValue(s.p[1]);
    return r;
  });
}
function afterSummon() {

// =============================================================
//  battle.js … 戦闘
//  毎手番「マスターの行動」と「サーヴァントの行動」を1つずつ選ぶ。
//
//  サーヴァントの行動
//   攻撃：白兵（筋力）/ 機動（敏捷）/ 魔術（魔力） … 三すくみ
//         白兵 ＞ 魔術 ＞ 機動 ＞ 白兵（有利な側に+15）
//   宝具：魔力50を使う大技。三すくみを無視。ただし真名が敵に知られる
//   防御：耐久で受け、ダメージ半減。防ぎ切れば次の手番に反撃補正
//   見切り：攻撃しない代わりに、次の敵の行動を確実に読み、真名の手がかりを得る
//   敵マスターを狙う：成功すれば一気に決着（アサシンが得意・悪）

//   撤退
//
//  マスターの行動
//   指揮（+5）/ 強化魔術（オド15：+14）/ 治癒魔術（オド20：HP+25）/ 道具
// =============================================================

const TACTICS = {
  str: { name: '白兵戦', stat: 0, beats: 'mag', tell: '大きく踏み込む構えを見せている（白兵戦の気配）' },
  agi: { name: '機動戦', stat: 2, beats: 'str', tell: '間合いを測り、素早く動き回っている（機動戦の気配）' },
  mag: { name: '魔術戦', stat: 3, beats: 'agi', tell: '周囲に魔力が渦巻いている（魔術戦の気配）' },
  np:  { name: '宝具', stat: 5, tell: '魔力が異常に高まっている――宝具が来る！' },
  guard: { name: '防御', stat: 1, tell: '腰を落とし、守りを固めている（防御の気配）' },
};
const MASTER_ACTS = {
  command: { name: '指揮に専念', hint: '+5' },
  boost:   { name: '強化魔術', hint: 'オド15・+14', od: 15 },
  heal:    { name: '治癒魔術', hint: 'オド20・HP+25', od: 20 },
  potion:  { name: '治癒の霊薬', hint: 'HP+35', item: 'potion' },
  gem:     { name: '宝石魔術', hint: '+12・敵に10', item: 'gem' },
  crystal: { name: '魔力結晶', hint: '魔力+40', item: 'crystal' },
};
let B = null; // 戦闘中の状態（セーブしない）

function startBattle(rival, opt = {}) {
  G.battles++;
  B = { r: rival, round: 0, opt, final: !!(opt.final || opt.boss), boss: !!opt.boss, miracle: false,
    enemyNext: null, tell: null, sure: false, charge: 0, echarge: 0, mact: 'command', extra: null, enemySeal: false };
  rival.intel = Math.max(rival.intel, 1);
  const pre = [];
  if (opt.defend && G.traps > 0) {
    G.traps--; rival.hp = Math.max(1, rival.hp - 20);
    pre.push(`<p>仕掛けておいた罠が炸裂した！ ${enemyName()}に20ダメージ。（残りの罠 ${G.traps}）</p>`);
  }
  planEnemy();
  battleScene(pre);
}
function enemyName() { return B.r.intel >= 3 ? servantOf(B.r).short : `敵${B.r.cls}`; }

// 敵の次の行動を決め、「構え」として見せるかどうかを決める
function planEnemy() {
  const r = B.r;
  let t;
  if (r.mp >= 50 && (r.hp < r.hpMax * 0.5 || Math.random() < 0.15)) t = 'np';
  else if (B.echarge === 0 && Math.random() < (r.hp < r.hpMax * 0.35 ? 0.25 : 0.1)) t = 'guard';
  else t = wpick(['str', 'agi', 'mag'], k => Math.pow(rivalParam(r, TACTICS[k].stat), 1.5));
  B.enemyNext = t;
  if (B.sure) { B.tell = `【見切り】${enemyName()}は${TACTICS[t].tell}`; B.sure = false; return; }
  const seeChance = t === 'np' ? 0.9 : 0.3 + G.master.stats.int / 200 + (r.intel >= 3 ? 0.2 : 0);
  if (Math.random() < seeChance) {
    const shown = t === 'np' || Math.random() < 0.75 ? t : pick(['str', 'agi', 'mag', 'guard']);
    B.tell = `${enemyName()}は${TACTICS[shown].tell}`;
  } else B.tell = null;
}

function mactAvailable(k) {
  const a = MASTER_ACTS[k];
  if (a.od && G.master.od < a.od) return false;
  if (a.item && !(G.items[a.item] > 0)) return false;
  return true;
}

        <div class="bar hp"><i style="width:${(sv.hp / servantHpMax()) * 100}%"></i></div></div>
      <div class="vs">VS</div>
      <div class="fighter enemy"><div class="fighter-top"><span class="fighter-name">${enemyName()}</span><span>${r.cls}${r.intel >= 3 ? '' : '（真名不明）'}　HP ${Math.max(0, r.hp)}/${r.hpMax}</span></div>
        <div class="bar enemy"><i style="width:${Math.max(0, r.hp / r.hpMax) * 100}%"></i></div>
        ${r.intel >= 3 ? `<div class="enemy-params">${PARAM_NAMES.map((n, i) => `${n}<b>${servantOf(r).p[i]}</b>`).join('')}</div>` : ''}</div>

    if (B.opt.duel) mods.push('一騎打ち');
    if (B.opt.defend && G.workshop) mods.push(`陣地Lv${G.workshop}`);

    const aff = classAffinity(me.cls, r.cls);

    if (B.final && G.flags.resolve === 'win') mods.push('決意');
    body.push(`<p>${B.boss ? '聖杯の内から、黒い泥が形を成して立ち上がる。' : B.final ? '聖杯を賭けた、最後の戦いが始まる。' : '戦闘開始。'}${mods.length ? `<br><span class="note">補正：${mods.join('・')}</span>` : ''}</p>`);
  }
  if (B.extra) body.push(...B.extra);
  if (B.tell) body.push(`<p class="tell">${B.tell}</p>`);
  // マスターの行動（トグル）
  const mk = Object.keys(MASTER_ACTS).filter(k => !MASTER_ACTS[k].item || G.items[MASTER_ACTS[k].item] > 0);
  if (!mactAvailable(B.mact)) B.mact = 'command';

    const a = MASTER_ACTS[k]; const cnt = a.item ? `×${G.items[a.item]}` : '';
    return `<button class="chip ${B.mact === k ? 'on' : ''}" data-mact="${k}" ${mactAvailable(k) ? '' : 'disabled'} aria-pressed="${B.mact === k}">${a.name}${cnt}<small>${a.hint}</small></button>`;
  }).join('')}</div></div>`);
  body.push('<p class="note rule">三すくみ：白兵 ＞ 魔術 ＞ 機動 ＞ 白兵</p>');

  const p = i => `${PARAM_NAMES[i]}${valueRank(servantParam(i))}`;
  const mpAfter = sv.mp + (B.mact === 'crystal' ? 40 : 0);
  const choices = [
    { label: '白兵戦', hint: `${p(0)}・魔術に強い`, fn: () => battleRound('str') },
    { label: '機動戦', hint: `${p(2)}・白兵に強い`, fn: () => battleRound('agi') },
    { label: '魔術戦', hint: `${p(3)}・機動に強い`, fn: () => battleRound('mag') },
    { label: `宝具「${me.np}」`, hint: `${p(5)}・魔力-50${sv.exposed ? '' : '・真名が知られる'}`, disabled: mpAfter < 50, fn: () => battleRound('np'), cls: 'primary' },
    { label: '防御', hint: `${p(1)}・被害半減、防げば反撃`, fn: () => battleRound('guard') },
    { label: '見切り', hint: '次の構えを確実に読む・真名の手がかり', fn: () => battleRound('observe') },
  ];
  if (!B.boss) choices.push({ label: '敵マスターを狙う', hint: `${isAssassin() ? '気配遮断で有利' : '成功率は低い'}・悪`, cls: 'danger', fn: () => battleRound('master') });
  choices.push({ label: `令呪を使う（残${G.master.seals}）`, hint: '4種の命令', disabled: G.master.seals < 1, cls: 'danger', fn: sealMenu });
  if (!B.final) choices.push({ label: '撤退する', hint: G.items.smoke ? '煙幕の護符で確実に' : '敏捷・幸運で判定', fn: () => battleRound('flee') });
  scene({ title: B.boss ? '黒き聖杯' : B.final ? '最終決戦' : '戦闘', sub: `ROUND ${B.round + 1}`, body, choices });
}
function sealMenu() {
  const choices = [
    { label: '「全力で打ち倒せ」', hint: '最も得意な攻撃に+35', cls: 'danger', fn: () => battleRound('seal_power') },

// ---------------- 1手番の処理 ----------------
function battleRound(cmd) {
  const r = B.r; const me = servantOf(G); const sv = G.servant;
  B.round++;
  const log = [];
  const P = me.short, E = enemyName();
  const et = B.enemyNext;

  // 令呪
  let tac = cmd, sealBoost = 0, npFree = false;
  if (cmd.startsWith('seal_')) {
    G.master.seals--; addLog('令呪を一画使用（戦闘）。');
    const order = { seal_power: '全力で打ち倒せ', seal_np: '宝具を解き放て', seal_endure: '耐え抜け', seal_retreat: '退け' }[cmd];
    log.push(`<b>「令呪をもって命ずる――${order}！」</b> 右手の令呪が一画、紅く輝いて消えた。`);
    if (cmd === 'seal_retreat') return escape(log.concat([`${P}の姿が掻き消え、次の瞬間にはあなたの隣にいた。令呪による空間転移だ。`]));
    if (cmd === 'seal_power') { sealBoost = 35; tac = ['str', 'agi', 'mag'].reduce((b, k) => servantParam(TACTICS[k].stat) > servantParam(TACTICS[b].stat) ? k : b, 'str'); }
    if (cmd === 'seal_np') { tac = 'np'; npFree = true; sealBoost = 20; }
    if (cmd === 'seal_endure') { tac = 'guard'; sealBoost = 30; sv.hp = Math.max(sv.hp, Math.round(servantHpMax() * 0.7)); }
  }

  // 撤退
  if (cmd === 'flee') {
    if (G.items.smoke > 0) { item('smoke', -1); return escape(log.concat(['煙幕の護符を地面に叩きつけた。濃い霧に紛れて離脱する。'])); }
    const mine = (servantParam(2) + servantParam(4)) / 2 + rand(1, 40) + 5;
    const theirs = rivalParam(r, 2) + rand(1, 40);
    if (mine >= theirs) return escape(log.concat([`${P}があなたを抱えて跳んだ。どうにか逃げ切れた。`]));
    log.push(`撤退に失敗！ ${E}に回り込まれた。`);
    const dmg = rand(10, 18); shp(-dmg); log.push(`${P}は${dmg}のダメージを受けた。`);
    return afterRound(log);
  }

  // マスターの行動
  let mBonus = 0; const ma = B.mact; B.mact = 'command';
  if (ma === 'command') mBonus = 5;
  if (ma === 'boost') { od(-15); mBonus = 14; log.push(`強化魔術で${P}の霊基を後押しした。`); }
  if (ma === 'heal') { od(-20); shp(25); log.push(`治癒魔術で${P}の傷を塞いだ。（HP+25）`); }
  if (ma === 'potion') { item('potion', -1); shp(35); log.push(`治癒の霊薬を使った。（HP+35）`); }
  if (ma === 'gem') { item('gem', -1); mBonus = 12; r.hp -= 10; log.push(`宝石を投げ放つ。炸裂した魔力が${E}を撃った！（10ダメージ）`); }
  if (ma === 'crystal') { item('crystal', -1); mp(40); log.push(`魔力結晶を砕き、${P}に魔力を流し込んだ。（魔力+40）`); }

  // 宝具の宣言
  if (tac === 'np') {
    if (!npFree) sv.mp -= 50;

      `<p>消えゆく${sv.short}の姿を見送りながら、あなたは悟る。この聖杯は、最初から呪われていたのだと。</p>`, '<p class="note">ヒント：聖杯の真実を知っていれば、別の選択肢があったかもしれない。</p>'] }),
    wishKnown: () => ({ title: '終幕：承知の上の願い', text: ['<p>呪われた聖杯と知りながら、あなたは願った。泥が溢れ、街に災いが降りかかる。</p>', `<p>${sv.short}は何も言わず、ただ悲しげにあなたを見つめていた。</p>`] }),
    servantWish: () => ({ title: '終幕：託された願い', text: [`<p>「${sv.short}。この聖杯は、君のものだ」</p>`, `<p>${sv.short}は驚き、それから静かに杯を受け取った。</p>`,
      `<p class="quote">「${SERVANT_WISH[sv.persona]}」</p>`, '<p>黄金の光が夜空に広がる。その願いがどんな形で叶ったのか、あなたには分からない。けれど、光の中で振り返った顔は、確かに笑っていた。</p>',
      G.flags.grailHint ? '<p class="note">杯の底に揺れた黒い影のことを、あなたは最後まで考えないようにした。</p>' : ''] }),
    destroy: () => ({ title: '終幕：冬の終わり', text: [`<p>${sv.short}の最後の一撃が、黒き聖杯を光の中に消し去った。呪いは霧散し、天降山に朝日が昇る。</p>`,
      `<p class="quote">${fmt(per.farewell)}</p>`, `<p>聖杯を手にすることはなかった。けれど、あなたは確かにこの街を救ったのだ。河川敷では、${CAST.old}が一人、深く頭を下げていた。</p>`] }),
    destroySpecial: () => ({ title: '終幕：夜明けの約束', text: [`<p>二人で選んだ答えは、聖杯の破壊だった。${sv.short}の一撃が呪いを焼き払い、夜が明けていく。</p>`,
      `<p>消えゆく体で、${sv.short}はあなたの手を握った。「${rel ? rel.name : ''}」として過ごした日々が、指先から伝わってくる。</p>`, `<p class="quote">${fmt(per.farewell)}</p>`,
      '<p>朝日の中に消えた姿を、あなたは決して忘れない。――いつかまた、どこかの空の下で。</p>'] }),
    together: () => ({ title: `終幕：${rel ? rel.name : ''}として`, text: [`<p>「${sv.short}に、この世界で生きる体を」</p>`, '<p>聖杯は願いを聞き届けた。黄金の光が霊基を包み、英霊は肉体を得て現世に降り立つ。</p>',
      `<p>冬が終わり、深見市に春が来た。桜並木の下を、${sv.short}と並んで歩く。「${rel ? rel.name : ''}」と呼び合う二人の、新しい日々が始まる。</p>`,
      G.flags.grailTruth ? '<p class="note">聖杯の呪いは今も山の下に眠っている。いつか、二人で向き合う日が来るだろう。</p>' : ''] }),
    none: () => ({ title: '終幕：願いなき勝者', text: ['<p>あなたは何も願わなかった。聖杯は誰の手にも渡らぬまま、静かに消えていった。</p>', `<p class="quote">${fmt(per.farewell)}</p>`,
      '<p>勝者の手に残ったのは、戦いの記憶と、確かに結ばれた絆だけだった。</p>'] }),
  }[kind]();
  addLog(E.title);
  SCENE = { kind: 'ending', title: E.title, text: E.text.filter(Boolean), good: !['dead', 'lost', 'wish', 'wishKnown', 'devoured'].includes(kind) };
  TAB = 'story'; render();
}

const ICON = {
  story: '<svg viewBox="0 0 24 24"><path d="M4 5h11a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3z"/><path d="M8 9h6M8 13h6"/></svg>',

  rivals: '<svg viewBox="0 0 24 24"><path d="M5 19L19 5M14 5h5v5M19 19L5 5M5 10V5h5"/></svg>',
  log: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',
};
const SEAL_PATH = 'M9 1 C 13 6, 15 10, 9 21 C 3 10, 5 6, 9 1 Z';

// ---------------- タイトル・キャラクター作成 ----------------
function titleScreen() {
  G = null; B = null;
  SCENE = { kind: 'title', save: loadSave() };
  TAB = 'story'; render();
}
function createScreen(master) {
  const m = master || rollMaster();
  SCENE = { kind: 'create', master: m, birth: BIRTHS.find(x => x.id === m.birth) };
  render();
}

function render() {
  const app = document.getElementById('app');
  if (!SCENE) return;
  const k = SCENE.kind;
  if (k === 'title' || k === 'create') { app.innerHTML = `<main class="main">${k === 'title' ? viewTitle() : viewCreate()}</main>`; return; }
  const top = G ? viewTop() : '';
  let content = '';
  if (TAB === 'story') content = k === 'summon' ? viewSummon() : k === 'ending' ? viewEnding() : viewScene();
  else if (TAB === 'master') content = viewMaster();
  else if (TAB === 'servant') content = viewServant();
  else if (TAB === 'rivals') content = viewRivals();
  else if (TAB === 'log') content = viewLog();
  const tabs = [['story', '物語'], ['master', 'マスター'], ['servant', '英霊'], ['rivals', '陣営'], ['log', '記録']];
  app.innerHTML = `${top}<main class="main" id="main">${content}</main>
    <nav class="tabs" aria-label="画面切り替え">${tabs.map(([id, l]) => `<button class="tab ${TAB === id ? 'on' : ''}" data-tab="${id}" aria-pressed="${TAB === id}">${ICON[id]}${l}</button>`).join('')}</nav>`;
}
function viewTop() {
  const night = G.slot === 1;
  const dayText = G.phase === 'prep' ? `${G.day}日目` : G.phase === 'summon' ? '開幕前夜' : G.phase === 'end' ? '終幕' : `${G.day}日目`;
  const seals = [0, 1, 2].map(i => `<svg class="seal ${i < G.master.seals ? '' : 'used'}" viewBox="0 0 18 22" aria-hidden="true"><path d="${SEAL_PATH}"/></svg>`).join('');
  const extraSeals = G.master.seals > 3 ? `<span class="tag red">+${G.master.seals - 3}</span>` : '';
  const sv = G.servant;
  return `<header class="topbar">
    <div class="topbar-row">
      <div class="when"><span class="when-phase">${phaseLabel()}</span><span class="when-day">${dayText}</span>
        ${G.phase === 'prep' || G.phase === 'war' ? `<span class="time-chip ${night ? 'night' : 'day'}">${night ? '夜' : '昼'}</span>` : ''}</div>
      <div class="seals" title="令呪 残り${G.master.seals}画" aria-label="令呪 残り${G.master.seals}画">${seals}${extraSeals}</div>
    </div>
    <div class="mini"><span>HP <b>${G.master.hp}</b></span><span>資金 <b>${G.master.money}</b>万円</span>
      ${sv ? `<span>${SV()} <b>${sv.hp}</b>/${servantHpMax()}</span><span>絆Lv <b>${Math.floor(sv.bond / 10)}</b></span>` : `<span>触媒 <b>${G.catalysts.length}</b></span>`}</div>
  </header>`;
}
function viewScene() {
  const s = SCENE;
  return `<article class="scene">
    ${s.sub ? `<div class="scene-sub">${s.sub}</div>` : ''}
    <h1 class="scene-title">${s.title}</h1>
    <div class="scene-body">${s.body.join('')}</div>
    <div class="choices">${s.choices.map((c, i) => `<button class="choice ${c.cls || ''}" data-choice="${i}" ${c.disabled ? 'disabled' : ''}>
      <span class="c-label">${c.label}</span>${c.hint ? `<span class="c-hint">${c.hint}</span>` : ''}</button>`).join('')}</div>
  </article>`;
}
function circleSVG(cls = '') {
  // 召喚陣：円と、円周上の点を結ぶ七芒星
  const pts = [...Array(7)].map((_, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / 7; return [50 + 34 * Math.cos(a), 50 + 34 * Math.sin(a)]; });
  const star = pts.map((_, i) => pts[(i * 3) % 7]).map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(2)} ${p[1].toFixed(2)}`).join(' ') + 'Z';
  return `<svg class="circle ${cls}" viewBox="0 0 100 100" aria-hidden="true">
    <g class="spin"><circle class="ring" cx="50" cy="50" r="47"/><circle class="ring" cx="50" cy="50" r="43"/>
      <path id="tp" d="M50 50 m-45 0 a45 45 0 1 1 90 0 a45 45 0 1 1 -90 0" fill="none"/>
      <text><textPath href="#tp">SABER · ARCHER · LANCER · RIDER · CASTER · ASSASSIN · BERSERKER ·</textPath></text></g>
    <g class="spin rev"><path class="ring red" d="${star}"/><circle class="ring" cx="50" cy="50" r="34"/><circle class="ring" cx="50" cy="50" r="14"/></g>
  </svg>`;
}
function viewTitle() {
  const save = SCENE.save;
  return `<div class="title-wrap">
    ${circleSVG()}
    <h1 class="game-title"><small>HOLY GRAIL WAR</small>深見市聖杯戦争</h1>
    <p class="lead">${CITY.intro}</p>
    <div class="choices">
      <button class="choice primary" data-act="new"><span class="c-label">はじめから</span><span class="c-hint">産まれはランダムで決まる</span></button>
      ${save ? `<button class="choice" data-act="continue"><span class="c-label">つづきから</span><span class="c-hint">${esc(save.master.name)}・${save.phase === 'prep' ? '準備期間' : '聖杯戦争'}${save.day}日目</span></button>` : ''}
    </div>
  </div>`;
}
function viewCreate() {
  const m = SCENE.master, b = SCENE.birth;
  return `<article class="scene">
    <div class="scene-sub">MASTER</div><h1 class="scene-title">あなたの産まれ</h1>
    <div class="birth-card">
      <div class="birth-name">${b.name}</div>
      <p style="margin:6px 0 10px;font-size:14px">${b.text}</p>
      <dl class="kv"><dt>年齢</dt><dd>${m.age}歳</dd><dt>魔術属性</dt><dd>${m.element}</dd><dt>魔術回路</dt><dd>${m.circuits}本</dd>
        <dt>資金</dt><dd>${m.money}万円</dd><dt>願い</dt><dd>${b.wish}</dd><dt>特徴</dt><dd>${b.perk}</dd></dl>
      <h3>能力値</h3>${statBars(m.stats)}

      <button class="choice" data-act="reroll"><span class="c-label">運命を引き直す</span><span class="c-hint">産まれ・能力を再抽選</span></button>
      <button class="choice" data-act="title"><span class="c-label">タイトルへ戻る</span></button>
    </div></article>`;
}
function statBars(stats) {
  return `<div class="bars">${Object.keys(STAT_LABEL).map(k => `<div class="bar-row"><span>${STAT_LABEL[k]}</span><div class="bar"><i style="width:${stats[k]}%"></i></div><span class="num">${stats[k]}</span></div>`).join('')}</div>`;
}
function paramGrid(p, effFn) {
  return `<div class="params">${PARAM_NAMES.map((n, i) => {
    const base = p[i]; const eff = effFn ? effFn(i) : null; const bv = rankValue(base);
    const diff = eff === null ? 0 : eff - bv;
    const shown = diff ? `${base}<small>→${valueRank(eff)}</small>` : base;
    return `<div class="param"><div class="pl">${n}</div><div class="pr ${diff > 0 ? 'up' : diff < 0 ? 'down' : ''}">${shown}</div>
      <div class="bar"><i style="width:${Math.min(100, ((eff ?? bv) / 65) * 100)}%"></i></div></div>`;
  }).join('')}</div>`;
}
function viewSummon() {
  const sv = SCENE.sv;
  return `<article class="scene">
    ${circleSVG('summon-glow')}
    <div class="reveal">
      <p class="quote" style="font-family:var(--font-display);font-size:16px;margin:16px 0">「${sv.line}」</p>

function servantCard(sv) {

}
function viewMaster() {
  const m = G.master; const b = BIRTHS.find(x => x.id === m.birth);
  return `<section class="panel"><h2>${M()}</h2><div><span class="tag gold">${b.name}</span><span class="tag">${alignLabel()}</span><span class="tag">${m.element}</span></div>
    <h3>状態</h3><div class="bars">
      <div class="bar-row"><span>HP</span><div class="bar hp"><i style="width:${m.hp}%"></i></div><span class="num">${m.hp}</span></div></div>
    <dl class="kv" style="margin-top:10px"><dt>令呪</dt><dd>${m.seals}画</dd><dt>資金</dt><dd>${m.money}万円</dd><dt>魔術回路</dt><dd>${m.circuits}本</dd>

    ${G.servant ? `<p class="note" style="font-size:12px;color:var(--muted)">マスターの魔力による英霊パラメータ補正：${masterCorrection() > 0 ? '+' : ''}${masterCorrection()}（魔力が低いとサーヴァントの性能が落ちる）</p>` : ''}
    <h3>道具</h3><div class="item-list">${Object.entries(ITEMS).map(([k, it]) => `<div><b>${it.name} ×${G.items[k] || 0}</b><span>${it.desc}</span></div>`).join('')}</div>

      ${G.flags.registered ? '<span class="tag green">教会に登録済み</span>' : ''}

      <div class="bar-row"><span>魔力</span><div class="bar mp"><i style="width:${s.mp}%"></i></div><span class="num">${s.mp}</span></div>

function viewRivals() {

        ${r.intel >= 3 ? `<div style="margin-top:8px">${paramGrid(s.p)}</div><p>宝具：${s.np}（${s.npRuby}）</p>` : ''}

}
function viewLog() {

// ---------------- 操作（タップ） ----------------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-choice],[data-tab],[data-act],[data-mact]');
  if (!t || t.disabled) return;
  if (t.dataset.mact) { if (B) { B.mact = t.dataset.mact; battleScene(); } return; }
  if (t.dataset.tab) { TAB = t.dataset.tab; if (SCENE) SCENE.confirmReset = false; render(); return; }
  if (t.dataset.choice !== undefined) { const c = SCENE.choices[+t.dataset.choice]; if (c && !c.disabled) c.fn(); return; }
  const a = t.dataset.act;
  if (a === 'new') createScreen();
  else if (a === 'reroll') { const name = document.getElementById('mname').value.trim(); const m = rollMaster(); if (name) m.name = name; createScreen(m); }
  else if (a === 'title' || a === 'totitle') titleScreen();
  else if (a === 'start') {
    const name = document.getElementById('mname').value.trim() || SCENE.master.name;
    SCENE.master.name = name.slice(0, 16);
    newGame(SCENE.master);
    const b = BIRTHS.find(x => x.id === G.master.birth);
    next('物語の始まり', [`<p>${CITY.intro}</p>`, `<p>${M()}――${b.name}。${b.text}</p>`,
      `<p>右手の甲に浮かんだ三画の紋様。それは聖杯に選ばれたマスターの証、<b>令呪</b>だ。召喚の夜まで、あと${PREP_DAYS}日。</p>`,
      G.catalysts.length ? `<p>家の宝物庫からは、英霊召喚の触媒<b>「${SV_BY_ID[G.catalysts[0]].catalyst}」</b>を持ち出してきた。</p>` : '',
      '<p class="note">準備期間のうちに能力を鍛え、触媒を探し、召喚陣を整えよう。触媒がなければ、あなたの在り方（秩序・混沌／善・悪）に似た英霊が応えるという。</p>'], () => { SLOT = {}; startSlot(); }, '準備を始める', 'PROLOGUE');
  }
  else if (a === 'continue') { G = SCENE.save; SLOT = { news: true, story: true, event: true }; startFromSave(); }
  else if (a === 'aftersummon') afterSummon();
  else if (a === 'reset') {
    if (SCENE.confirmReset) { clearSave(); titleScreen(); }
    else { SCENE.confirmReset = true; render(); }
  }
});
function startFromSave() {
  if (G.phase === 'summon') return summonScene();
  hub();
}

// ---------------- 起動 ----------------
function boot(data) {
  if (data && data.save) { try { G = JSON.parse(data.save); SLOT = { news: true, story: true, event: true }; return startFromSave(); } catch (e) { } }
  titleScreen();
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ save: LAST_HUB }));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});

</script>
