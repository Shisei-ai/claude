<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鋼鉄戦線 - Steel Front</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ヘッダー：資源 -->
  <header id="hud">
    <div class="logo"><span class="logo-mark">◆</span><span class="logo-tx">鋼鉄戦線<span>STEEL FRONT</span></span></div>
    <div class="res-rail">
      <div class="res" id="res-ore" title="鉄（建設・部品の主資源）">
        <span class="ic">⛓</span><span class="rbody"><span class="rlabel">鉄 / ORE</span><span class="rnum"><b id="ore-val">0</b><i id="ore-cap">/0</i></span></span>
      </div>
      <div class="res" id="res-research" title="研究ポイント（テック解放）">
        <span class="ic">🔬</span><span class="rbody"><span class="rlabel">研究 / RP</span><span class="rnum"><b id="res-val">0</b><em id="res-rate">+0/s</em></span></span>
      </div>
      <div class="res" id="res-power" title="電力（供給／消費）。消費が供給を超えると生産効率が低下">
        <span class="ic">⚡</span><span class="rbody"><span class="rlabel">電力 / PWR</span><span class="rnum"><b id="pow-val">0/0</b><em id="pow-eff"></em></span></span>
      </div>
      <div class="res" id="res-mod" title="採取モジュール（空き／保有上限）。鉱区へ投入して素材を採取">
        <span class="ic">📦</span><span class="rbody"><span class="rlabel">採取 / MOD</span><span class="rnum"><b id="mod-val">0/0</b></span></span>
      </div>
      <div class="res" id="res-cap" title="指揮容量（展開できるユニット総量）">
        <span class="ic">📡</span><span class="rbody"><span class="rlabel">指揮 / CMD</span><span class="rnum"><b id="cap-val">0/0</b></span></span>
      </div>
    </div>
    <div class="chapter-info">
      <div id="chap-title">―</div>
      <div id="wave-info">―</div>
    </div>
  </header>

  <!-- 戦場 -->
  <main id="battlefield">
    <div id="hq-bar-wrap"><div id="hq-bar"></div><span id="hq-label">オールト HP</span></div>
    <canvas id="lane"></canvas>
    <div id="battle-stat"></div>
    <div id="cutin"><div class="ci-inner"><div class="ci-jp"></div><div class="ci-en"></div></div></div>
    <div id="battle-control">
      <button id="home-btn">🏠 執務室</button>
      <button id="wave-btn">▶ 次の波を呼ぶ</button>
      <button id="defense-btn" style="display:none">🛡 暫時防衛</button>
      <span id="phase-hint"></span>
    </div>
  </main>

  <!-- 操作パネル -->
  <section id="panels">
    <nav id="tabs">
      <button data-tab="zone" class="active">⛏ 鉱区</button>
      <button data-tab="prod">🏭 生産ライン</button>
      <button data-tab="tech">🔬 研究</button>
    </nav>
    <div id="tab-zone" class="tab-body active"></div>
    <div id="tab-prod" class="tab-body"></div>
    <div id="tab-tech" class="tab-body"></div>
  </section>

  <!-- ログ -->
  <footer id="logbar"><div id="log"></div></footer>

  <!-- 章開始のフルスクリーン・カットイン（立ち絵風） -->
  <div id="chapter-cut">
    <div class="cc-stripes"></div>
    <div class="cc-glow"></div>
    <canvas class="cc-portrait" width="240" height="240"></canvas>
    <div class="cc-text">
      <div class="cc-num"></div>
      <div class="cc-title"></div>
      <div class="cc-sub"></div>
    </div>
    <div class="cc-skip">クリックでスキップ ▶</div>
  </div>

  <!-- ホーム画面（執務室ハブ：母港風レイアウト） -->
  <div id="home">
    <div class="home-bg"></div>
    <div class="port-grid"></div>
    <div class="home-window"><span class="hw-dome"></span></div>
    <div class="port-floor"></div>

    <!-- 秘書官・ケイオスの立ち絵（クリックで台詞）。進行でボディ起動前後を切替 -->
    <div id="home-fig" class="home-fig" title="ケイオスに話しかける" role="button" tabindex="0">
      <div class="home-fig-bubble" id="home-fig-bubble"></div>
      <img id="home-fig-img" alt="ケイオス" src="portraits/chaos.png"
           onerror="this.style.visibility='hidden'">
    </div>

    <!-- 上部ステータスバー -->
    <div class="port-top">
      <div class="port-id">
        <span class="port-id-jp" id="home-chap">―</span>
        <span class="port-id-en">OORT COMMAND OFFICE</span>
      </div>
      <div class="port-res">
        <div class="pr-box" title="鉄"><span class="pr-ic">⛓</span><span class="pr-tx"><i>鉄 / ORE</i><b id="home-iron">0</b></span></div>
        <div class="pr-box" title="研究ポイント"><span class="pr-ic">🔬</span><span class="pr-tx"><i>研究 / RP</i><b id="home-res">0</b></span></div>
        <div class="pr-box" title="採取モジュール"><span class="pr-ic">📦</span><span class="pr-tx"><i>採取 / MOD</i><b id="home-mod">0/0</b></span></div>
      </div>
    </div>

    <!-- 左メニュー（母港コマンド） -->
    <nav class="port-menu">
      <button class="port-btn primary" data-home="story">
        <span class="pb-ic">⚔</span>
        <span class="pb-tx"><b>メインストーリー</b><i>SORTIE ・ 前線へ出撃し物語を進める</i></span>
        <span class="pb-go">▶</span>
      </button>
      <button class="port-btn" data-home="zone">
        <span class="pb-ic">⛏</span><span class="pb-tx"><b>鉱区</b><i>RESOURCE ・ 採取モジュールの配置</i></span><span class="pb-go">▶</span>
      </button>
      <button class="port-btn" data-home="prod">
        <span class="pb-ic">🏭</span><span class="pb-tx"><b>生産ライン</b><i>FACTORY ・ 設備配置とコンベア接続</i></span><span class="pb-go">▶</span>
      </button>
      <button class="port-btn" data-home="tech">
        <span class="pb-ic">🔬</span><span class="pb-tx"><b>研究</b><i>RESEARCH ・ 兵科・規格・特殊の解放</i></span><span class="pb-go">▶</span>
      </button>
      <button class="port-btn" data-home="defense">
        <span class="pb-ic">🛡</span><span class="pb-tx"><b>暫時防衛</b><i id="home-def-sub">章クリアで解放</i></span><span class="pb-go">▶</span>
      </button>
    </nav>

    <!-- 秘書官のひとこと（ボイスバー） -->
    <div class="port-voice" id="home-speak" title="ケイオスに話しかける" role="button" tabindex="0">
      <span class="hk-orb" id="home-orb">🤖</span>
      <span class="pv-body"><span class="pv-name">ケイオス</span><span id="home-greet">本日も業務、よろしくお願いしますね、マスター。</span></span>
      <span class="pv-hint">▶ クリックで話す</span>
    </div>
  </div>

  <!-- VN会話劇（立ち絵＋名前＋台詞） -->
  <div id="vn">
    <div id="vn-bg"></div>
    <div class="vn-flash"></div>
    <div class="vn-stage">
      <div class="vn-portrait left"></div>
      <div class="vn-portrait right"></div>
    </div>
    <div id="vn-box">
      <div id="vn-name"></div>
      <div id="vn-text"></div>
      <div id="vn-next">▼</div>
    </div>
    <div class="vn-skip">スキップ ▶▶</div>
  </div>

  <!-- モーダル（シナリオ／選択／勝敗） -->
  <div id="overlay" class="hidden">
    <div id="modal">
      <h2 id="modal-title"></h2>
      <p id="modal-body"></p>
      <div id="modal-choices"></div>
      <button id="modal-ok">続ける ▶</button>
    </div>
  </div>

</div>

<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/factory.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
