<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鋼鉄戦線 - Steel Front</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ヘッダー：資源 -->
  <header id="hud">
    <div class="logo">鋼鉄戦線<span>STEEL FRONT</span></div>
    <div class="res" id="res-ore" title="鉄（建設・部品の主資源）">
      <span class="ic">⛓</span><b id="ore-val">0</b><i id="ore-cap">/0</i>
    </div>
    <div class="res" id="res-research" title="研究ポイント（テック解放）">
      <span class="ic">🔬</span><b id="res-val">0</b><em id="res-rate">+0/s</em>
    </div>
    <div class="res" id="res-power" title="電力（供給／消費）。消費が供給を超えると生産効率が低下">
      <span class="ic">⚡</span><b id="pow-val">0/0</b><em id="pow-eff"></em>
    </div>
    <div class="res" id="res-mod" title="採取モジュール（空き／保有上限）。鉱区へ投入して素材を採取">
      <span class="ic">📦</span><b id="mod-val">0/0</b>
    </div>
    <div class="res" id="res-cap" title="指揮容量（展開できるユニット総量）">
      <span class="ic">📡</span><b id="cap-val">0/0</b>
    </div>
    <div class="chapter-info">
      <div id="chap-title">―</div>
      <div id="wave-info">―</div>
    </div>
  </header>

  <!-- 戦場 -->
  <main id="battlefield">
    <div id="hq-bar-wrap"><div id="hq-bar"></div><span id="hq-label">オールト HP</span></div>
    <canvas id="lane"></canvas>
    <div id="cutin"><div class="ci-inner"><div class="ci-jp"></div><div class="ci-en"></div></div></div>
    <div id="battle-control">
      <button id="home-btn">🏠 執務室</button>
      <button id="wave-btn">▶ 次の波を呼ぶ</button>
      <button id="defense-btn" style="display:none">🛡 暫時防衛</button>
      <span id="phase-hint"></span>
    </div>
  </main>

  <!-- 操作パネル -->
  <section id="panels">
    <nav id="tabs">
      <button data-tab="zone" class="active">⛏ 鉱区</button>
      <button data-tab="fac">🏗 設備</button>
      <button data-tab="fab">🏭 部品工場</button>
      <button data-tab="asm">⚙ 組立</button>
      <button data-tab="tech">🔬 研究</button>
    </nav>
    <div id="tab-zone" class="tab-body active"></div>
    <div id="tab-fac" class="tab-body"></div>
    <div id="tab-fab" class="tab-body"></div>
    <div id="tab-asm" class="tab-body"></div>
    <div id="tab-tech" class="tab-body"></div>
  </section>

  <!-- ログ -->
  <footer id="logbar"><div id="log"></div></footer>

  <!-- 章開始のフルスクリーン・カットイン（立ち絵風） -->
  <div id="chapter-cut">
    <div class="cc-stripes"></div>
    <div class="cc-glow"></div>
    <canvas class="cc-portrait" width="240" height="240"></canvas>
    <div class="cc-text">
      <div class="cc-num"></div>
      <div class="cc-title"></div>
      <div class="cc-sub"></div>
    </div>
    <div class="cc-skip">クリックでスキップ ▶</div>
  </div>

  <!-- ホーム画面（執務室ハブ） -->
  <div id="home">
    <div class="home-bg"></div>
    <div class="home-window"><span class="hw-dome"></span></div>
    <div class="home-pipes"></div>
    <div class="home-inner">
      <div class="home-head">
        <div class="home-title">管理執務室<span>OORT COMMAND OFFICE</span></div>
        <div class="home-status">
          <span id="home-chap">―</span>
          <i class="hs-sep"></i>
          <span class="hs-r" title="鉄">⛓ <b id="home-iron">0</b></span>
          <span class="hs-r" title="研究">🔬 <b id="home-res">0</b></span>
          <span class="hs-r" title="採取モジュール">📦 <b id="home-mod">0/0</b></span>
        </div>
      </div>
      <div class="home-kchaos"><span class="hk-orb">🤖</span><span id="home-greet">本日も業務、よろしくお願いしますね、マスター。</span></div>
      <div class="home-menu">
        <button class="home-btn primary" data-home="story">
          <span class="hb-ic">📖</span><span class="hb-tx"><b>メインストーリー</b><i>前線へ出て、防衛と物語を進める</i></span>
        </button>
        <div class="home-grid">
          <button class="home-btn" data-home="zone"><span class="hb-ic">⛏</span><span class="hb-tx"><b>鉱区</b><i>採取モジュールの配置</i></span></button>
          <button class="home-btn" data-home="fac"><span class="hb-ic">🏗</span><span class="hb-tx"><b>設備</b><i>製錬・発電などの建設</i></span></button>
          <button class="home-btn" data-home="fab"><span class="hb-ic">🏭</span><span class="hb-tx"><b>部品工場</b><i>ボディ・ヘッド・ウェポン生産</i></span></button>
          <button class="home-btn" data-home="asm"><span class="hb-ic">⚙</span><span class="hb-tx"><b>組立</b><i>機体設計と量産ライン</i></span></button>
          <button class="home-btn" data-home="tech"><span class="hb-ic">🔬</span><span class="hb-tx"><b>研究</b><i>兵科・規格・特殊の解放</i></span></button>
          <button class="home-btn" data-home="defense"><span class="hb-ic">🛡</span><span class="hb-tx"><b>暫時防衛</b><i id="home-def-sub">章クリアで解放</i></span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- VN会話劇（立ち絵＋名前＋台詞） -->
  <div id="vn">
    <div id="vn-bg"></div>
    <div class="vn-flash"></div>
    <div class="vn-stage">
      <div class="vn-portrait left"></div>
      <div class="vn-portrait right"></div>
    </div>
    <div id="vn-box">
      <div id="vn-name"></div>
      <div id="vn-text"></div>
      <div id="vn-next">▼</div>
    </div>
    <div class="vn-skip">スキップ ▶▶</div>
  </div>

  <!-- モーダル（シナリオ／選択／勝敗） -->
  <div id="overlay" class="hidden">
    <div id="modal">
      <h2 id="modal-title"></h2>
      <p id="modal-body"></p>
      <div id="modal-choices"></div>
      <button id="modal-ok">続ける ▶</button>
    </div>
  </div>

</div>

<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
